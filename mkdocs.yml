site_name: Pantheon
site_url: https://ils15.github.io/pantheon-opencode/
site_description: Multi-agent orchestration framework for OpenCode — 14 specialized agents and 20 skills
repo_url: https://github.com/ils15/pantheon-opencode
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.action.edit
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
  - mike:
      version_selector: true

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ils15/pantheon-opencode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: INDEX.md
  - Getting Started:
      - Installation: INSTALLATION.md
      - Quick Start: QUICKSTART.md
      - Upgrading: UPGRADING.md
      - Upgrading (Português): UPGRADING.pt-BR.md
  - Compatibility: COMPATIBILITY.md
  - Architecture: ARCHITECTURE.md
  - Agents & Skills: agents/README.md
  - Permissions, Gates & Delegation: PERMISSIONS-QUALITY-DELEGATION.md
  - OpenCode V2: opencode-v2.md
  - MCP: MCP.md
  - MCP Tools: mcp-tools.md
  - Memory: MEMORY.md
  - Platforms: PLATFORMS.md
  - Reference:
      - Model Routing: reference/model-routing.md
      - Environment Variables: reference/env-vars.md
      - Code Mode: reference/code-mode.md
  - Release Process:
      - Release Process: RELEASING.md
      - v1.6.0 Release Notes: releases/v1.6.0.md
  - Branch Protection: BRANCH-PROTECTION.md
  - Contributing: https://github.com/ils15/pantheon-opencode/blob/main/CONTRIBUTING.md
