site_name: Pantheon
site_url: https://ils15.github.io/pantheon-opencode/
site_description: Multi-agent orchestration framework for OpenCode — 14 specialized agents and 25 skills
repo_url: https://github.com/ils15/pantheon-opencode
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.action.edit
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false
  - mike:
      version_selector: true

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ils15/pantheon-opencode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: INSTALLATION.md
      - Quick Start: QUICKSTART.md
      - Upgrading: UPGRADING.md
      - Upgrading (Português): UPGRADING.pt-BR.md
  - Guides & Tutorials:
      - First Project (End-to-End): guides/first-project.md
      - Agent Capability Matrix: AGENT-CAPABILITY-MATRIX.md
      - Deepwork Blueprint: guides/deepwork.md
      - Pantheon Vision: guides/vision.md
      - Practical Cookbook: guides/cookbook.md
  - Compatibility: COMPATIBILITY.md
  - Architecture: ARCHITECTURE.md
  - Agents & Skills: agents/README.md
  - Permissions, Gates & Delegation: PERMISSIONS-QUALITY-DELEGATION.md
  - OpenCode 2.x: opencode.md
  - MCP: MCP.md
  - MCP Tools: mcp-tools.md
  - Memory: MEMORY.md
  - Platforms: PLATFORMS.md
  - Reference:
      - Model Routing: reference/model-routing.md
      - Local Decision Router: reference/local-decision-router.md
      - Native Decisions (Jev): reference/native-decisions.md
      - Offline Evaluation: reference/offline-evaluation.md
      - Performance: reference/performance.md
      - Skill Search Design: reference/skill-search-design.md
      - Environment Variables: reference/env-vars.md
      - Code Mode: reference/code-mode.md
  - Release Process:
      - Release Process: RELEASING.md
      - v1.6.0 Release Notes: releases/v1.6.0.md
  - Branch Protection: BRANCH-PROTECTION.md
  - Documentação (Português):
      - Início: pt-BR/index.md
      - Começando:
          - Início Rápido: pt-BR/QUICKSTART.md
          - Instalação: pt-BR/INSTALLATION.md
          - Atualização: UPGRADING.pt-BR.md
      - Guias & Tutoriais:
          - Primeiro Projeto (Ponta a Ponta): pt-BR/guides/first-project.md
          - Matriz de Agentes: pt-BR/AGENT-CAPABILITY-MATRIX.md
          - Blueprint Deepwork: pt-BR/guides/deepwork.md
          - Visão Multimodal: pt-BR/guides/vision.md
          - Livro de Receitas (Cookbook): pt-BR/guides/cookbook.md
  - Contributing: https://github.com/ils15/pantheon-opencode/blob/main/CONTRIBUTING.md
