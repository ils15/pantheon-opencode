name: Zenodo Verification

# Weekly read-only audit of the Zenodo archive.
#
# Every release gate compares version *strings* between the committed
# manifests; nothing in the release path asks Zenodo what it actually
# archived, so a stale `.zenodo.json` at tag time — or an integration that
# silently stopped — stays invisible until someone reads the DOI by hand.
# This job is the cheap backstop: it resolves the concept DOI to its latest
# archived version and fails when that is not the version npm serves on
# `latest`.
#
# Read-only by construction: no secrets, no write scopes, no release action.
on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenodo-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.4.0'

      # Compare against the published package, not the version on `main`: a
      # bump PR may legitimately land before its release is dispatched.
      - name: Compare the concept's latest archive with npm latest
        run: |
          set -euo pipefail
          EXPECTED="$(npm view pantheon-opencode@latest version)"
          echo "npm latest: $EXPECTED"
          node scripts/verify-zenodo.mjs --expected "$EXPECTED"
