name: Beta Release

on:
  push:
    branches: [develop]
    # Ignore version bumps to prevent infinite loop
    paths-ignore:
      - 'package.json'

permissions:
  id-token: write
  contents: write

jobs:
  beta:
    name: Beta Release
    runs-on: ubuntu-latest
    concurrency:
      group: beta-release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: npm install -g npm@latest

      - run: npm ci --ignore-scripts || npm install

      - name: Quality gates
        run: |
          npm test 2>&1 || echo "Test warnings"
          npm audit --audit-level=high 2>&1 || echo "Audit warnings"

      - name: Get current version
        id: version
        run: echo "current=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"

      - name: Bump beta version
        id: bump
        run: |
          CURRENT="${{ steps.version.outputs.current }}"
          npm version prerelease --preid beta --no-git-tag-version
          NEXT=$(node -p 'require("./package.json").version')
          echo "from=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "to=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          cat > /tmp/beta-notes.md <<- EOF
          Beta release from develop.
          Install with: npm install pantheon-opencode@beta

          Changes since ${{ steps.bump.outputs.from }}:
          $(git log "${{ steps.bump.outputs.from }}..HEAD" --oneline --no-decorate 2>/dev/null || echo "See commit history")
          EOF

      - name: Publish to npm (beta tag)
        run: npm publish --tag beta --access public --provenance 2>&1

      - name: Commit version bump back to develop
        run: |
          git config user.name "pantheon-bot"
          git config user.email "bot@pantheon.dev"
          git add package.json
          git add pyproject.toml plugin.json .github/plugin/plugin.json 2>/dev/null || true
          git commit -m "chore(beta): v${{ steps.bump.outputs.to }} [skip ci]"
          git push

      - name: Create GitHub Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ steps.bump.outputs.to }}"
          gh release create "$VERSION" \
            --title "Pantheon ${VERSION} (beta)" \
            --prerelease \
            --notes-file /tmp/beta-notes.md
          echo "Published beta $VERSION"
