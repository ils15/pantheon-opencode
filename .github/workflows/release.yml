name: Release

on:
  workflow_dispatch:
    inputs:
      validation_run_id:
        description: 'Successful first-attempt Release validation run ID on main'
        required: true
        type: string
      package_artifact_id:
        description: 'Immutable package artifact ID from the validation run'
        required: true
        type: string
      manifest_artifact_id:
        description: 'Immutable provenance artifact ID from the validation run'
        required: true
        type: string
      source_commit:
        description: 'Exact full source SHA reported by validation'
        required: true
        type: string
      expected_tarball_sha256:
        description: 'Exact 64-character digest explicitly approved for release'
        required: true
        type: string
      release_channel:
        description: 'npm channel to publish'
        required: true
        type: choice
        options:
          - stable
          - beta
      recovery_version:
        description: 'Existing beta version to recover; must match the validated artifact'
        required: false
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify validation run and immutable package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      workflow_id: ${{ steps.run.outputs.workflow_id }}
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - name: Enforce authorized first-attempt main dispatch and required inputs
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          PACKAGE_ARTIFACT_ID: ${{ inputs.package_artifact_id }}
          MANIFEST_ARTIFACT_ID: ${{ inputs.manifest_artifact_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EXPECTED_DIGEST: ${{ inputs.expected_tarball_sha256 }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const positive = (value) => /^[1-9]\d*$/.test(value) && Number.isSafeInteger(Number(value))
          if (process.env.GITHUB_REF !== 'refs/heads/main') throw new Error('Release is allowed only from refs/heads/main.')
          if (process.env.GITHUB_ACTOR !== 'ils15' || process.env.GITHUB_TRIGGERING_ACTOR !== 'ils15') throw new Error('Actor and triggering actor must both be ils15.')
          if (process.env.GITHUB_RUN_ATTEMPT !== '1') throw new Error('Release reruns are forbidden.')
          for (const name of ['VALIDATION_RUN_ID', 'PACKAGE_ARTIFACT_ID', 'MANIFEST_ARTIFACT_ID']) if (!positive(process.env[name] ?? '')) throw new Error(`${name} must be a positive integer ID.`)
          if (process.env.PACKAGE_ARTIFACT_ID === process.env.MANIFEST_ARTIFACT_ID) throw new Error('Package and manifest artifact IDs must differ.')
          if (!/^[0-9a-fA-F]{40}$/.test(process.env.SOURCE_COMMIT ?? '')) throw new Error('source_commit must be a full 40-character SHA.')
          if (!/^[0-9a-fA-F]{64}$/.test(process.env.EXPECTED_DIGEST ?? '')) throw new Error('expected_tarball_sha256 must be a full SHA-256 digest.')
          if (!['stable', 'beta'].includes(process.env.RELEASE_CHANNEL)) throw new Error('release_channel must be stable or beta.')
          if (
            process.env.RECOVERY_VERSION &&
            (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)-beta\.[1-9]\d*$/.test(process.env.RECOVERY_VERSION) || process.env.RELEASE_CHANNEL !== 'beta')
          ) {
            throw new Error('Recovery requires a beta channel and an X.Y.Z-beta.N version.')
          }
          NODE

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Confirm named validation run and artifact ownership
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          PACKAGE_ARTIFACT_ID: ${{ inputs.package_artifact_id }}
          MANIFEST_ARTIFACT_ID: ${{ inputs.manifest_artifact_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$RELEASE_REPO/actions/runs/$VALIDATION_RUN_ID" > "$RUNNER_TEMP/validation-run.json"
          gh api "repos/$RELEASE_REPO/actions/runs/$VALIDATION_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/validation-artifacts.json"
          result="$(node scripts/release-guard.mjs validation-run "$RUNNER_TEMP/validation-run.json" "$RUNNER_TEMP/validation-artifacts.json")"
          workflow_id="$(printf '%s' "$result" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).workflowId)))')"
          echo "workflow_id=$workflow_id" >> "$GITHUB_OUTPUT"

      - name: Download exact provenance artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.manifest_artifact_id }}
          run-id: ${{ inputs.validation_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-provenance

      - name: Verify provenance manifest against approved values
        id: manifest
        env:
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          EXPECTED_WORKFLOW_ID: ${{ steps.run.outputs.workflow_id }}
          PACKAGE_ARTIFACT_ID: ${{ inputs.package_artifact_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EXPECTED_DIGEST: ${{ inputs.expected_tarball_sha256 }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
        run: |
          set -euo pipefail
          files=("$RUNNER_TEMP/release-provenance"/*.json)
          [ "${#files[@]}" -eq 1 ] && [ -f "${files[0]}" ] || {
            echo '::error::Expected exactly one provenance manifest.'
            exit 1
          }
          result="$(node scripts/release-guard.mjs manifest "${files[0]}")"
          version="$(printf '%s' "$result" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download exact package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.package_artifact_id }}
          run-id: ${{ inputs.validation_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-package

      - name: Verify tarball bytes and embedded npm version
        id: package
        env:
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          EXPECTED_WORKFLOW_ID: ${{ steps.run.outputs.workflow_id }}
          PACKAGE_ARTIFACT_ID: ${{ inputs.package_artifact_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EXPECTED_DIGEST: ${{ inputs.expected_tarball_sha256 }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
        run: |
          set -euo pipefail
          tarballs=("$RUNNER_TEMP/release-package"/*.tgz)
          [ "${#tarballs[@]}" -eq 1 ] && [ -f "${tarballs[0]}" ] || {
            echo '::error::Package artifact must contain exactly one tarball.'
            exit 1
          }
          tar -tzf "${tarballs[0]}" > "$RUNNER_TEMP/package-contents.txt"
          grep -Fx 'package/package.json' "$RUNNER_TEMP/package-contents.txt" >/dev/null || {
            echo '::error::Downloaded file is not an npm package tarball.'
            exit 1
          }
          tar -xOzf "${tarballs[0]}" package/package.json > "$RUNNER_TEMP/release-package.json"
          result="$(node scripts/release-guard.mjs package \
            "$RUNNER_TEMP/release-provenance/$(basename "$(find "$RUNNER_TEMP/release-provenance" -maxdepth 1 -type f -name '*.json' -print -quit)")" \
            "$RUNNER_TEMP/release-package/metadata.json" "${tarballs[0]}" "$RUNNER_TEMP/release-package.json")"
          package_path="$(printf '%s' "$result" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).tarball))')"
          echo "package=$package_path" >> "$GITHUB_OUTPUT"

      - name: Summarize exact release candidate before environment approval
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PACKAGE_VERSION: ${{ steps.manifest.outputs.version }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          WORKFLOW_ID: ${{ steps.run.outputs.workflow_id }}
          PACKAGE_ARTIFACT_ID: ${{ inputs.package_artifact_id }}
          MANIFEST_ARTIFACT_ID: ${{ inputs.manifest_artifact_id }}
          EXPECTED_DIGEST: ${{ inputs.expected_tarball_sha256 }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
        run: |
          set -euo pipefail
          {
            echo '## Release candidate verified; protected approval is next'
            echo
            echo '| Value | Verified result |'
            echo '| --- | --- |'
            echo "| Source commit | \`${SOURCE_COMMIT,,}\` |"
            echo "| Version | \`$PACKAGE_VERSION\` |"
            echo "| Channel | \`$RELEASE_CHANNEL\` |"
            echo "| Recovery version | \`${RECOVERY_VERSION:-none}\` |"
            echo "| Validation workflow ID | \`$WORKFLOW_ID\` |"
            echo "| Validation run ID | \`$VALIDATION_RUN_ID\` |"
            echo "| Package artifact ID | \`$PACKAGE_ARTIFACT_ID\` |"
            echo "| Provenance artifact ID | \`$MANIFEST_ARTIFACT_ID\` |"
            echo "| Approved tarball SHA-256 | \`$EXPECTED_DIGEST\` |"
            echo
            echo 'The human reviewer must verify this exact digest was explicitly approved in the conversation. No publish credential is available in this job.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish verified immutable artifact
    needs: verify
    runs-on: ubuntu-latest
    environment: beta-release
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Recheck dispatch policy before environment-protected mutations
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          PACKAGE_ARTIFACT_ID: ${{ inputs.package_artifact_id }}
          MANIFEST_ARTIFACT_ID: ${{ inputs.manifest_artifact_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EXPECTED_DIGEST: ${{ inputs.expected_tarball_sha256 }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const positive = (value) => /^[1-9]\d*$/.test(value) && Number.isSafeInteger(Number(value))
          if (process.env.GITHUB_REF !== 'refs/heads/main') throw new Error('Release is allowed only from refs/heads/main.')
          if (process.env.GITHUB_ACTOR !== 'ils15' || process.env.GITHUB_TRIGGERING_ACTOR !== 'ils15') throw new Error('Actor and triggering actor must both be ils15.')
          if (process.env.GITHUB_RUN_ATTEMPT !== '1') throw new Error('Release reruns are forbidden.')
          for (const name of ['VALIDATION_RUN_ID', 'PACKAGE_ARTIFACT_ID', 'MANIFEST_ARTIFACT_ID']) if (!positive(process.env[name] ?? '')) throw new Error(`${name} must be a positive integer ID.`)
          if (process.env.PACKAGE_ARTIFACT_ID === process.env.MANIFEST_ARTIFACT_ID) throw new Error('Package and manifest artifact IDs must differ.')
          if (!/^[0-9a-fA-F]{40}$/.test(process.env.SOURCE_COMMIT ?? '')) throw new Error('source_commit must be a full 40-character SHA.')
          if (!/^[0-9a-fA-F]{64}$/.test(process.env.EXPECTED_DIGEST ?? '')) throw new Error('expected_tarball_sha256 must be a full SHA-256 digest.')
          if (!['stable', 'beta'].includes(process.env.RELEASE_CHANNEL)) throw new Error('release_channel must be stable or beta.')
          if (
            process.env.RECOVERY_VERSION &&
            (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)-beta\.[1-9]\d*$/.test(process.env.RECOVERY_VERSION) || process.env.RELEASE_CHANNEL !== 'beta')
          ) {
            throw new Error('Recovery requires a beta channel and an X.Y.Z-beta.N version.')
          }
          NODE

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Reconfirm validation run and artifact IDs
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          PACKAGE_ARTIFACT_ID: ${{ inputs.package_artifact_id }}
          MANIFEST_ARTIFACT_ID: ${{ inputs.manifest_artifact_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$RELEASE_REPO/actions/runs/$VALIDATION_RUN_ID" > "$RUNNER_TEMP/validation-run.json"
          gh api "repos/$RELEASE_REPO/actions/runs/$VALIDATION_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/validation-artifacts.json"
          result="$(node scripts/release-guard.mjs validation-run "$RUNNER_TEMP/validation-run.json" "$RUNNER_TEMP/validation-artifacts.json")"
          workflow_id="$(printf '%s' "$result" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).workflowId)))')"
          echo "workflow_id=$workflow_id" >> "$GITHUB_OUTPUT"

      - name: Download verified provenance artifact by immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.manifest_artifact_id }}
          run-id: ${{ inputs.validation_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-provenance

      - name: Verify immutable provenance manifest
        id: manifest
        env:
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          EXPECTED_WORKFLOW_ID: ${{ steps.run.outputs.workflow_id }}
          PACKAGE_ARTIFACT_ID: ${{ inputs.package_artifact_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EXPECTED_DIGEST: ${{ inputs.expected_tarball_sha256 }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
        run: |
          set -euo pipefail
          files=("$RUNNER_TEMP/release-provenance"/*.json)
          [ "${#files[@]}" -eq 1 ] && [ -f "${files[0]}" ] || {
            echo '::error::Expected exactly one provenance manifest.'
            exit 1
          }
          result="$(node scripts/release-guard.mjs manifest "${files[0]}")"
          version="$(printf '%s' "$result" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download exact package artifact by immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.package_artifact_id }}
          run-id: ${{ inputs.validation_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-package

      - name: Verify immutable package and provenance before any mutation
        id: package
        env:
          EXPECTED_DIGEST: ${{ inputs.expected_tarball_sha256 }}
          PACKAGE_ARTIFACT_ID: ${{ inputs.package_artifact_id }}
        run: |
          set -euo pipefail
          tarballs=("$RUNNER_TEMP/release-package"/*.tgz)
          [ "${#tarballs[@]}" -eq 1 ] && [ -f "${tarballs[0]}" ] || {
            echo '::error::Package artifact must contain exactly one tarball.'
            exit 1
          }
          tar -tzf "${tarballs[0]}" > "$RUNNER_TEMP/package-contents.txt"
          grep -Fx 'package/package.json' "$RUNNER_TEMP/package-contents.txt" >/dev/null || {
            echo '::error::Downloaded file is not an npm package tarball.'
            exit 1
          }
          tar -xOzf "${tarballs[0]}" package/package.json > "$RUNNER_TEMP/release-package.json"
          manifest_file="$(find "$RUNNER_TEMP/release-provenance" -maxdepth 1 -type f -name '*.json' -print -quit)"
          result="$(node scripts/release-guard.mjs package \
            "$manifest_file" "$RUNNER_TEMP/release-package/metadata.json" \
            "${tarballs[0]}" "$RUNNER_TEMP/release-package.json")"
          package_path="$(printf '%s' "$result" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).tarball))')"
          echo "package=$package_path" >> "$GITHUB_OUTPUT"
          {
            echo '## Protected release package reverified'
            echo
            echo "Version: \`${{ steps.manifest.outputs.version }}\`  "
            echo "SHA-256: \`${EXPECTED_DIGEST}\`  "
            echo "Package artifact ID: \`$PACKAGE_ARTIFACT_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check whether exact npm version is already published
        id: npm_check
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
          PACKAGE: ${{ steps.package.outputs.package }}
        run: |
          set -euo pipefail
          if npm view "pantheon-opencode@$VERSION" dist.integrity --json > "$RUNNER_TEMP/npm-integrity.json" 2> "$RUNNER_TEMP/npm-view-error"; then
            published_integrity="$(tr -d '"[:space:]' < "$RUNNER_TEMP/npm-integrity.json")"
            package_integrity="$(node -e '
              const fs = require("node:fs")
              const crypto = require("node:crypto")
              process.stdout.write(crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))
            ' "$PACKAGE")"
            expected_integrity="sha512-$package_integrity"
            [ "$published_integrity" = "$expected_integrity" ] || {
              echo '::error::This exact npm version exists but its published tarball differs from the approved artifact.'
              exit 1
            }
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif grep -Eqi 'E404|404[[:space:]]+Not Found|code[[:space:]]+E404' "$RUNNER_TEMP/npm-view-error"; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            echo '::error::Could not determine npm version status; refusing to publish.'
            cat "$RUNNER_TEMP/npm-view-error"
            exit 1
          fi

      - name: Ensure stable release does not move npm latest backwards
        if: inputs.release_channel == 'stable'
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          npm view 'pantheon-opencode@latest' version --json > "$RUNNER_TEMP/latest-stable-version.json" || {
            echo '::error::Could not determine the latest published stable npm version; refusing stable release.'
            exit 1
          }
          node scripts/release-guard.mjs stable-version-check "$RUNNER_TEMP/latest-stable-version.json"

      - name: Preflight npm publish credential before release mutations
        env:
          BETA_RELEASE_NPM_TOKEN: ${{ secrets.BETA_RELEASE_NPM_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${BETA_RELEASE_NPM_TOKEN:-}" || {
            echo '::error::beta-release environment secret BETA_RELEASE_NPM_TOKEN is required before release mutations.' >&2
            exit 1
          }

      - name: Create or verify immutable git tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          VERSION: ${{ steps.manifest.outputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
        run: |
          set -euo pipefail
          source_sha="${SOURCE_COMMIT,,}"
          tag_ref="v$VERSION"
          [[ "$tag_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[1-9][0-9]*)?$ ]] || {
            echo '::error::Release tag is malformed.'
            exit 1
          }
          response="$RUNNER_TEMP/tag-response"
          if gh api --include "repos/$RELEASE_REPO/git/ref/tags/$tag_ref" > "$response" 2> "$RUNNER_TEMP/tag-error"; then
            status="$(awk 'NR == 1 { print $2; exit }' "$response")"
            [ "$status" = 200 ] || { echo '::error::Unexpected existing-tag lookup status.'; exit 1; }
            awk 'BEGIN { body=0 } /^\r?$/ { body=1; next } body { print }' "$response" > "$RUNNER_TEMP/tag-body.json"
            object="$(node scripts/release-guard.mjs tag-ref "$RUNNER_TEMP/tag-body.json")"
            type="${object%%$'\t'*}"
            object_sha="${object#*$'\t'}"
            depth=0
            while [ "$type" = tag ]; do
              [ "$depth" -lt 4 ] || { echo '::error::Annotated tag nesting is too deep.'; exit 1; }
              gh api "repos/$RELEASE_REPO/git/tags/$object_sha" > "$RUNNER_TEMP/annotated-tag.json"
              type="$(node -e 'process.stdout.write(require(process.argv[1]).object.type)' "$RUNNER_TEMP/annotated-tag.json")"
              object_sha="$(node -e 'process.stdout.write(require(process.argv[1]).object.sha)' "$RUNNER_TEMP/annotated-tag.json")"
              [[ "$object_sha" =~ ^[0-9a-fA-F]{40}$ ]] || { echo '::error::Annotated tag object SHA is invalid.'; exit 1; }
              depth=$((depth + 1))
            done
            [ "$type" = commit ] && [ "${object_sha,,}" = "$source_sha" ] || {
              echo '::error::Existing release tag does not point to source_commit.'
              exit 1
            }
          else
            status="$(awk 'NR == 1 { print $2; exit }' "$response" 2>/dev/null || true)"
            [ "$status" = 404 ] || { echo '::error::Could not determine tag state.'; cat "$RUNNER_TEMP/tag-error"; exit 1; }
            [ -z "$RECOVERY_VERSION" ] || { echo '::error::Recovery requires an existing beta tag.'; exit 1; }
            gh api --method POST "repos/$RELEASE_REPO/git/refs" -f "ref=refs/tags/$tag_ref" -f "sha=$source_sha"
          fi

      - name: Create stable GitHub release if absent
        if: inputs.release_channel == 'stable' && inputs.recovery_version == ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          VERSION: ${{ steps.manifest.outputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          source_sha="${SOURCE_COMMIT,,}"
          response="$RUNNER_TEMP/release-response"
          if gh api --include "repos/$RELEASE_REPO/releases/tags/v$VERSION" > "$response" 2> "$RUNNER_TEMP/release-error"; then
            status="$(awk 'NR == 1 { print $2; exit }' "$response")"
            [ "$status" = 200 ] || { echo '::error::Unexpected release lookup status.'; exit 1; }
            awk 'BEGIN { body=0 } /^\r?$/ { body=1; next } body { print }' "$response" > "$RUNNER_TEMP/release-body"
            RELEASE_BODY="$RUNNER_TEMP/release-body" SOURCE_COMMIT="$source_sha" VERSION="v$VERSION" node <<'NODE'
          const fs = require('node:fs')
          const release = JSON.parse(fs.readFileSync(process.env.RELEASE_BODY, 'utf8'))
          if (release.tag_name !== process.env.VERSION || release.target_commitish !== process.env.SOURCE_COMMIT) {
            throw new Error('Existing GitHub release does not identify the validated tag and source commit.')
          }
          NODE
          elif [ "$(awk 'NR == 1 { print $2; exit }' "$response" 2>/dev/null || true)" = 404 ]; then
            notes="$RUNNER_TEMP/release-package/release-notes.md"
            [ -f "$notes" ] || { echo '::error::Validated release notes are missing.'; exit 1; }
            gh release create "v$VERSION" --repo "$RELEASE_REPO" --target "$source_sha" --verify-tag --title "Pantheon $VERSION" --notes-file "$notes"
          else
            echo '::error::Could not determine GitHub Release state.'
            cat "$RUNNER_TEMP/release-error"
            exit 1
          fi

      - name: Publish exact artifact to npm
        if: steps.npm_check.outputs.exists != 'true'
        env:
          BETA_RELEASE_NPM_TOKEN: ${{ secrets.BETA_RELEASE_NPM_TOKEN }}
          PACKAGE: ${{ steps.package.outputs.package }}
          RELEASE_TAG: ${{ inputs.recovery_version != '' && 'beta' || inputs.release_channel == 'beta' && 'beta' || 'latest' }}
        run: |
          set -euo pipefail
          npmrc="$RUNNER_TEMP/npmrc"
          umask 077
          trap 'rm -f "$npmrc"' EXIT
          printf '//registry.npmjs.org/:_authToken=%s\n' "$BETA_RELEASE_NPM_TOKEN" > "$npmrc"
          NPM_CONFIG_USERCONFIG="$npmrc" npm publish "$PACKAGE" --ignore-scripts --tag "$RELEASE_TAG" --access public --provenance --registry https://registry.npmjs.org
