name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (from package.json)'
        required: false
  pull_request:
    types: [labeled]
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.actor != 'github-actions[bot]') ||
      (github.event_name == 'pull_request' && github.event.label.name == 'release:beta')
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci --ignore-scripts 2>/dev/null || npm install

      - name: Determine release type
        id: type
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute beta version
        if: steps.type.outputs.channel == 'beta'
        id: betaver
        run: |
          PR=${{ github.event.number || '0' }}
          SHA=$(git rev-parse --short HEAD)
          BASE=$(node -p "require('./package.json').version")
          echo "version=${BASE}-beta.${PR}.${SHA}" >> "$GITHUB_OUTPUT"

      - name: Bump to beta version
        if: steps.type.outputs.channel == 'beta'
        run: |
          npm version ${{ steps.betaver.outputs.version }} --no-git-tag-version

      - name: Pack and verify
        run: npm pack --dry-run 2>&1 | tail -3

      - name: Check if version exists on npm
        id: npm_check
        run: |
          VER=$(node -p "require('./package.json').version")
          NPM_VER=$(npm view pantheon-opencode version --tag ${{ steps.type.outputs.tag }} 2>/dev/null || echo "none")
          if [ "$NPM_VER" = "$VER" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm_check.outputs.exists == 'false'
        run: npm publish --tag ${{ steps.type.outputs.tag }} --access public --provenance 2>&1

      - name: Create GitHub Release
        if: steps.npm_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "${{ steps.type.outputs.channel }}" = "beta" ]; then
            PR=${{ github.event.number }}
            gh release create "$VERSION" \
              --title "Pantheon ${VERSION} (PR #${PR})" \
              --prerelease \
              --notes "Beta release from PR #${PR}."
          else
            gh release create "$VERSION" \
              --title "Pantheon ${VERSION}" \
              --notes-file CHANGELOG.md
          fi
          echo "Published $VERSION"

      - name: Post comment on PR
        if: steps.type.outputs.channel == 'beta' && steps.npm_check.outputs.exists == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const ver = '${{ steps.betaver.outputs.version }}';
            const pr = ${{ github.event.number }};
            github.rest.issues.createComment({
              ...context.repo,
              issue_number: pr,
              body: `📦 Beta \`${ver}\` published.\n\n\`\`\`\nnpm install pantheon-opencode@${ver}\nnpm install pantheon-opencode@beta\n\`\`\``
            });
