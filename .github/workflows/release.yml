name: Release

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Channel to publish: stable (default) or beta'
        required: false
        type: choice
        default: 'stable'
        options:
          - 'stable'
          - 'beta'
      recovery_version:
        description: 'Existing beta semver prerelease to recover (without v)'
        required: false
        type: string
      recovery_target_sha:
        description: 'Full commit SHA already referenced by the beta tag'
        required: false
        type: string
      recovery_pr_number:
        description: 'Positive PR number encoded in the beta version'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

# Every run is an explicit operator action (workflow_dispatch). Validation
# runs on the checked-out ref, so it never receives a release credential. The
# release job consumes only the immutable artifact produced by that job and has
# write permissions solely because it performs the release.
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EVENT_NAME: ${{ github.event_name }}
      RELEASE_CHANNEL: ${{ inputs.release_channel }}
      RECOVERY_VERSION: ${{ inputs.recovery_version }}
      RECOVERY_TARGET_SHA: ${{ inputs.recovery_target_sha }}
      RECOVERY_PR_NUMBER: ${{ inputs.recovery_pr_number }}
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_target_sha || github.sha }}
    steps:
      # This is deliberately the first step. In particular, no release
      # mutation can be reached before the recovery inputs are a coherent set.
      - name: Validate release inputs before checkout
        run: |
          set -euo pipefail
          RECOVERY_VERSION="$RECOVERY_VERSION" RECOVERY_TARGET_SHA="$RECOVERY_TARGET_SHA" RECOVERY_PR_NUMBER="$RECOVERY_PR_NUMBER" EVENT_NAME="$EVENT_NAME" node <<'NODE'
          const version = process.env.RECOVERY_VERSION ?? '';
          const sha = process.env.RECOVERY_TARGET_SHA ?? '';
          const pr = process.env.RECOVERY_PR_NUMBER ?? '';
          const supplied = [version, sha, pr].filter(Boolean).length;
          if (process.env.EVENT_NAME !== 'workflow_dispatch' && supplied) throw new Error('Recovery inputs are only valid for workflow_dispatch.');
          if (supplied && supplied !== 3) throw new Error('Recovery inputs must be supplied together.');
          if (supplied) {
            // Beta recovery versions use the repository convention from
            // release-beta-version.mjs: exactly the first seven lowercase
            // characters of the full target SHA.
            const match = /^(\d+\.\d+\.\d+)-beta\.(\d+)\.([0-9a-f]{7})$/.exec(version);
            if (!match) throw new Error('Recovery version must be <base>-beta.<pr>.<7-char-lowercase-sha>.');
            if (!/^[0-9a-fA-F]{40}$/.test(sha)) throw new Error('Recovery target SHA must be a full 40-hex SHA.');
            const value = Number(pr);
            if (!/^\d+$/.test(pr) || !Number.isSafeInteger(value) || value <= 0) throw new Error('Recovery PR number must be a positive safe integer.');
            if (match[2] !== pr) throw new Error('Recovery version PR must match recovery_pr_number.');
            if (match[3] !== sha.slice(0, 7).toLowerCase()) throw new Error('Recovery version SHA suffix must match recovery_target_sha.');
          }
          NODE
          case "$RELEASE_CHANNEL" in
            stable|beta) : ;;
            *) echo "::error::release_channel must be 'stable' or 'beta'."; exit 1 ;;
          esac
          case "$TARGET_SHA" in
            ''|*[!0-9a-fA-F]*) echo "::error::Target SHA must be hexadecimal."; exit 1 ;;
          esac
          [ "${#TARGET_SHA}" -eq 40 ] || { echo "::error::Target SHA must be 40 characters."; exit 1; }

      - name: Assert validation has no release credentials
        run: |
          set -euo pipefail
          test -z "${NODE_AUTH_TOKEN:-}" || { echo "::error::Validation received NODE_AUTH_TOKEN."; exit 1; }
          test -z "${NPM_TOKEN:-}" || { echo "::error::Validation received NPM_TOKEN."; exit 1; }
          test -z "${RELEASE_TOKEN:-}" || { echo "::error::Validation received RELEASE_TOKEN."; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm checkout matches TARGET_SHA
        run: |
          set -euo pipefail
          EXPECTED_SHA="${TARGET_SHA,,}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ] || {
            echo "::error::Checked out commit does not match TARGET_SHA."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Dispatched ref code is untrusted. No lifecycle script is allowed to run
      # in this job.
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Determine release type
        id: type
        run: |
          set -euo pipefail
          if [ -n "$RECOVERY_VERSION" ]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "tag=beta" >> "$GITHUB_OUTPUT"
            echo "recovery=true" >> "$GITHUB_OUTPUT"
          else
            echo "channel=$RELEASE_CHANNEL" >> "$GITHUB_OUTPUT"
            if [ "$RELEASE_CHANNEL" = "beta" ]; then
              echo "tag=beta" >> "$GITHUB_OUTPUT"
            else
              echo "tag=latest" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Apply exact recovery version
        if: steps.type.outputs.recovery == 'true'
        run: |
          set -euo pipefail
          npm version "$RECOVERY_VERSION" --no-git-tag-version --ignore-scripts >/dev/null
          node scripts/version-check.mjs --fix

      - name: Query published stable version
        if: steps.type.outputs.channel == 'beta' && steps.type.outputs.recovery != 'true'
        id: npm_latest
        run: |
          set -euo pipefail
          LATEST_RESPONSE="$RUNNER_TEMP/npm-latest-response"
          LATEST_ERROR="$RUNNER_TEMP/npm-latest-error"
          if npm view pantheon-opencode dist-tags.latest --json > "$LATEST_RESPONSE" 2> "$LATEST_ERROR"; then
            LATEST=$(tr -d '"[:space:]' < "$LATEST_RESPONSE")
            printf '%s' "$LATEST" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' || { echo "::error::npm latest is not a valid semver baseline: $LATEST"; exit 1; }
          elif grep -Eqi 'E404|404[[:space:]]+Not Found|code[[:space:]]+E404' "$LATEST_ERROR" "$LATEST_RESPONSE"; then
            echo '::error::Published npm package was not found; refusing to compute a beta version.'; exit 1
          else
            echo '::error::Could not determine published npm metadata; refusing to compute a beta version.'; cat "$LATEST_ERROR"; exit 1
          fi
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Compute and apply beta version
        if: steps.type.outputs.channel == 'beta' && steps.type.outputs.recovery != 'true'
        id: beta_version
        env:
          LATEST_BASELINE: ${{ steps.npm_latest.outputs.latest }}
        run: |
          set -euo pipefail
          FULL_TARGET_SHA="$(git rev-parse HEAD)"
          [ "$FULL_TARGET_SHA" = "${TARGET_SHA,,}" ] || { echo '::error::Computed beta version SHA is not TARGET_SHA.'; exit 1; }
          VERSION=$(node scripts/release-beta-version.mjs --latest="$LATEST_BASELINE" --intent=patch --pr="$GITHUB_RUN_NUMBER" --sha="$FULL_TARGET_SHA" --apply)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Version gate
        id: version_gate
        env:
          GATE_CHANNEL: ${{ steps.type.outputs.channel }}
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
          COMPUTED_BETA_VERSION: ${{ steps.beta_version.outputs.version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const pkgVer = String(JSON.parse(fs.readFileSync('package.json', 'utf8')).version || '');
          const channel = process.env.GATE_CHANNEL || 'stable';
          const stable = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          const beta = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)-beta\.[1-9]\d*\.[0-9a-f]{7}$/;
          if (process.env.RECOVERY_VERSION) {
            if (pkgVer !== process.env.RECOVERY_VERSION) {
              console.error('::error::Recovery package version was not applied exactly.');
              process.exit(1);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkgVer}\nlatest_stable=v${pkgVer}\n`);
            process.exit(0);
          }
          const tags = execFileSync('git', ['tag', '-l', 'v[0-9]*'], { encoding: 'utf8' })
            .trim().split('\n').filter(Boolean).filter((t) => /^v\d+\.\d+\.\d+$/.test(t));
          const cmp = (a, b) => {
            const pa = a.split('.').map(Number); const pb = b.split('.').map(Number);
            for (let i = 0; i < 3; i++) if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) > (pb[i] || 0) ? 1 : -1;
            return 0;
          };
          tags.sort((a, b) => cmp(a.slice(1), b.slice(1)));
          const latest = tags.length ? tags.at(-1) : 'v0.0.0';
          if (channel === 'beta') {
            if (!beta.test(pkgVer) || (process.env.COMPUTED_BETA_VERSION && pkgVer !== process.env.COMPUTED_BETA_VERSION)) {
              console.error(`::error::Beta version gate failed: ${pkgVer}.`);
              process.exit(1);
            }
          } else if (!stable.test(pkgVer) || cmp(pkgVer, latest.slice(1)) < 0) {
            console.error(`::error::Version gate failed: ${pkgVer} (latest stable ${latest}).`);
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkgVer}\nlatest_stable=${latest}\n`);
          NODE

      - name: Validate release manifests
        # Both channels must validate the checked-out manifests before an
        # artifact is created or any release credential is exposed.
        run: node scripts/version-check.mjs

      - name: Create release artifact and notes
        env:
          BASE_VERSION: ${{ steps.version_gate.outputs.version }}
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-artifact"
          if [ -n "$RECOVERY_VERSION" ]; then
            printf '%s\n' "Recovery publish for existing GitHub Release $RECOVERY_VERSION." > "$RUNNER_TEMP/release-notes.md"
          elif ! node scripts/changelog-extract.mjs "$BASE_VERSION" > "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md has no [$BASE_VERSION] section."; exit 1
          fi
          npm run package:evidence -- --output-dir="$RUNNER_TEMP/release-artifact" --target-sha="$TARGET_SHA" > "$RUNNER_TEMP/package-evidence.json"
          TARBALLS=("$RUNNER_TEMP/release-artifact"/*.tgz)
          [ "${#TARBALLS[@]}" -eq 1 ] && [ -f "${TARBALLS[0]}" ] || {
            echo "::error::Package evidence must contain exactly one .tgz."
            exit 1
          }
          METADATA_PATH="$RUNNER_TEMP/release-artifact/metadata.json" TARGET_SHA="$TARGET_SHA" TARBALL="${TARBALLS[0]}" node <<'NODE'
          const { createHash } = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const metadata = JSON.parse(fs.readFileSync(process.env.METADATA_PATH, 'utf8'));
          const targetSha = String(process.env.TARGET_SHA || '').trim().toLowerCase();
          const tarball = process.env.TARBALL;
          const actualSha = createHash('sha256').update(fs.readFileSync(tarball)).digest('hex');
          if (!/^\d+\.\d+\.\d+(?:-beta\.\d+\.[0-9a-f]+)?$/.test(metadata.version || '')) throw new Error('Invalid package evidence version.');
          if (metadata.targetSha !== targetSha) throw new Error('Package evidence target SHA does not match TARGET_SHA.');
          if (!/^[0-9a-f]{64}$/.test(metadata.tarballSha256 || '') || metadata.tarballSha256 !== actualSha) throw new Error('Package evidence tarball SHA-256 is invalid.');
          if (metadata.tarball !== path.basename(tarball)) throw new Error('Package evidence tarball name is invalid.');
          NODE
          cp "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/release-artifact/release-notes.md"

      - uses: actions/upload-artifact@v4
        with:
          name: release-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/release-artifact
          if-no-files-found: error
          retention-days: 1

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      EVENT_NAME: ${{ github.event_name }}
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_target_sha || github.sha }}
      RECOVERY_VERSION: ${{ inputs.recovery_version }}
      RECOVERY_TARGET_SHA: ${{ inputs.recovery_target_sha }}
      RECOVERY_PR_NUMBER: ${{ inputs.recovery_pr_number }}
      RELEASE_REPO: ${{ github.repository }}
      # Recovery and beta channel are beta publishes; stable dispatch is latest.
      RELEASE_TAG: ${{ inputs.recovery_version != '' && 'beta' || inputs.release_channel == 'beta' && 'beta' || 'latest' }}
    steps:
      # Defense in depth: this step must remain before every gh/tag/npm
      # mutation in this job. It does not inspect or execute the artifact.
      - name: Revalidate release inputs before mutations
        run: |
          set -euo pipefail
          RELEASE_REPO="$RELEASE_REPO" node <<'NODE'
          const repo = process.env.RELEASE_REPO ?? '';
          if (!/^[A-Za-z0-9][A-Za-z0-9_.-]*\/[A-Za-z0-9][A-Za-z0-9_.-]*$/.test(repo)) {
            throw new Error('RELEASE_REPO must be an owner/name GitHub repository.');
          }
          NODE
          RECOVERY_VERSION="$RECOVERY_VERSION" RECOVERY_TARGET_SHA="$RECOVERY_TARGET_SHA" RECOVERY_PR_NUMBER="$RECOVERY_PR_NUMBER" node <<'NODE'
          const values = [process.env.RECOVERY_VERSION ?? '', process.env.RECOVERY_TARGET_SHA ?? '', process.env.RECOVERY_PR_NUMBER ?? ''];
          if (values.some(Boolean) && values.filter(Boolean).length !== 3) throw new Error('Recovery inputs must be supplied together.');
          if (values[0]) {
            const match = /^(\d+\.\d+\.\d+)-beta\.(\d+)\.([0-9a-f]{7})$/.exec(values[0]);
            if (!match || !/^[0-9a-fA-F]{40}$/.test(values[1])) throw new Error('Invalid recovery version or SHA.');
            if (!/^\d+$/.test(values[2]) || !Number.isSafeInteger(Number(values[2])) || Number(values[2]) <= 0) throw new Error('Invalid recovery PR number.');
            if (match[2] !== values[2]) throw new Error('Recovery version PR must match recovery_pr_number.');
            if (match[3] !== values[1].slice(0, 7).toLowerCase()) throw new Error('Recovery version SHA suffix must match recovery_target_sha.');
          }
          NODE
          if [ -n "$RECOVERY_VERSION" ]; then
            [ "$EVENT_NAME" = "workflow_dispatch" ] || { echo '::error::Recovery requires workflow_dispatch.'; exit 1; }
            TARGET_SHA="$RECOVERY_TARGET_SHA"
          fi
          TARGET_SHA=$(printf '%s' "$TARGET_SHA" | tr '[:upper:]' '[:lower:]')
          case "$TARGET_SHA" in ''|*[!0-9a-fA-F]*) echo "::error::Target SHA must be hexadecimal."; exit 1 ;; esac
          [ "${#TARGET_SHA}" -eq 40 ] || { echo "::error::Target SHA must be 40 characters."; exit 1; }
          printf 'TARGET_SHA=%s\n' "$TARGET_SHA" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: release-inputs-${{ github.run_id }}
          path: release-artifact

      - name: Validate immutable artifact metadata
        id: metadata
        run: |
          set -euo pipefail
          TARBALLS=(release-artifact/*.tgz)
          [ "${#TARBALLS[@]}" -eq 1 ] && [ -f "${TARBALLS[0]}" ] || {
            echo "::error::Release artifact must contain exactly one .tgz."
            exit 1
          }
          PACKAGE=$(realpath -- "${TARBALLS[0]}")
          [ -f "$PACKAGE" ] || { echo "::error::Release package artifact path is invalid."; exit 1; }
          tar -tzf "$PACKAGE" > "$RUNNER_TEMP/package-contents" || {
            echo "::error::Release package artifact is not a readable tarball."; exit 1;
          }
          grep -Fxq 'package/package.json' "$RUNNER_TEMP/package-contents" || {
            echo "::error::Release package artifact is not an npm package tarball."; exit 1;
          }
          tar -xOzf "$PACKAGE" package/package.json > "$RUNNER_TEMP/package.json" || {
            echo "::error::Could not read package metadata from release artifact."; exit 1;
          }
          METADATA_VALUES=$(METADATA_PATH=release-artifact/metadata.json TARGET_SHA="$TARGET_SHA" PACKAGE="$PACKAGE" PACKAGE_JSON="$RUNNER_TEMP/package.json" node <<'NODE'
          const { createHash } = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const metadata = JSON.parse(fs.readFileSync(process.env.METADATA_PATH, 'utf8'));
          const packageJson = JSON.parse(fs.readFileSync(process.env.PACKAGE_JSON, 'utf8'));
          const expectedTarget = String(process.env.TARGET_SHA || '').trim().toLowerCase();
          const actualSha = createHash('sha256').update(fs.readFileSync(process.env.PACKAGE)).digest('hex');
          if (!/^\d+\.\d+\.\d+(?:-beta\.\d+\.[0-9a-f]+)?$/.test(metadata.version || '')) throw new Error('Invalid artifact version.');
          if (!/^[0-9a-f]{40}$/.test(metadata.targetSha || '') || metadata.targetSha !== expectedTarget) throw new Error('Artifact target SHA does not match TARGET_SHA.');
          if (!/^[0-9a-f]{64}$/.test(metadata.tarballSha256 || '') || metadata.tarballSha256 !== actualSha) throw new Error('Downloaded tarball SHA-256 does not match metadata.');
          if (metadata.tarball !== path.basename(process.env.PACKAGE)) throw new Error('Artifact metadata tarball name does not match the downloaded file.');
          if (packageJson.name !== 'pantheon-opencode' || packageJson.version !== metadata.version) throw new Error('Release tarball package metadata does not match the validated artifact.');
          for (const [file, expected] of [['version', metadata.version], ['target-sha', metadata.targetSha], ['tarball-sha256', metadata.tarballSha256]]) {
            if (fs.readFileSync(path.join('release-artifact', file), 'utf8').trim() !== expected) throw new Error(`Artifact ${file} does not match metadata.`);
          }
          process.stdout.write(`${metadata.version}\t${metadata.targetSha}\t${metadata.tarballSha256}`);
          NODE
          )
          IFS=$'\t' read -r VERSION ARTIFACT_SHA TARBALL_SHA256 <<< "$METADATA_VALUES"
          [ -n "$VERSION" ] && [ "$ARTIFACT_SHA" = "${TARGET_SHA,,}" ] && [ "${#TARBALL_SHA256}" -eq 64 ] || {
            echo "::error::Artifact metadata output is malformed."; exit 1;
          }
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Check idempotency
        id: idem
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          TAG_REF="$VERSION"
          if [ -n "$RECOVERY_VERSION" ]; then
            EXPECTED_TAG="v${RECOVERY_VERSION}"
            [ "$TAG_REF" = "$EXPECTED_TAG" ] || { echo '::error::Recovery artifact version differs from requested version.'; exit 1; }
            fi

          TAG_OBJECT_SHA=""
          TAG_REF="$TAG_REF" node <<'NODE'
          const tag = process.env.TAG_REF ?? '';
          if (!/^v\d+\.\d+\.\d+(?:-beta\.\d+\.[0-9a-f]+)?$/.test(tag)) {
            throw new Error('Release tag ref is invalid.');
          }
          NODE
          if TAG_RESPONSE=$(gh api "repos/$RELEASE_REPO/git/ref/tags/$TAG_REF" --include 2>"$RUNNER_TEMP/tag-ref-error"); then
            TAG_STATUS=$(printf '%s\n' "$TAG_RESPONSE" | awk 'NR == 1 { print $2; exit }')
            [ "$TAG_STATUS" = 200 ] || { echo "::error::Unexpected GitHub tag API status: ${TAG_STATUS:-unknown}."; exit 1; }
            printf '%s\n' "$TAG_RESPONSE" | awk 'BEGIN { body=0 } /^\r?$/ { body=1; next } body { print }' > "$RUNNER_TEMP/tag-ref-body"
            TAG_OBJECT=$(TAG_BODY="$RUNNER_TEMP/tag-ref-body" node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.env.TAG_BODY, 'utf8'));
          const object = body.object ?? body;
          const sha = String(object.sha ?? '').trim().toLowerCase();
          if (!['tag', 'commit'].includes(object.type) || !/^[0-9a-f]{40}$/.test(sha)) {
            throw new Error('GitHub tag API returned an invalid object.');
          }
          process.stdout.write(`${object.type}\t${sha}`);
          NODE
            )
            TAG_OBJECT_TYPE=${TAG_OBJECT%%$'\t'*}
            TAG_OBJECT_SHA=${TAG_OBJECT#*$'\t'}
            TAG_DEPTH=0
            while [ "$TAG_OBJECT_TYPE" = tag ]; do
              [ "$TAG_DEPTH" -lt 4 ] || { echo '::error::Annotated tag nesting is too deep.'; exit 1; }
              TAG_RESPONSE=$(gh api "repos/$RELEASE_REPO/git/tags/$TAG_OBJECT_SHA" --include 2>"$RUNNER_TEMP/tag-object-error") || { echo '::error::Could not resolve annotated tag object.'; cat "$RUNNER_TEMP/tag-object-error"; exit 1; }
              TAG_STATUS=$(printf '%s\n' "$TAG_RESPONSE" | awk 'NR == 1 { print $2; exit }')
              [ "$TAG_STATUS" = 200 ] || { echo "::error::Unexpected GitHub tag object API status: ${TAG_STATUS:-unknown}."; exit 1; }
              printf '%s\n' "$TAG_RESPONSE" | awk 'BEGIN { body=0 } /^\r?$/ { body=1; next } body { print }' > "$RUNNER_TEMP/tag-object-body"
              TAG_OBJECT=$(TAG_BODY="$RUNNER_TEMP/tag-object-body" node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.env.TAG_BODY, 'utf8'));
          const object = body.object;
          const sha = String(object?.sha ?? '').trim().toLowerCase();
          if (!object || !['tag', 'commit'].includes(object.type) || !/^[0-9a-f]{40}$/.test(sha)) {
            throw new Error('GitHub annotated tag API returned an invalid object.');
          }
          process.stdout.write(`${object.type}\t${sha}`);
          NODE
              )
              TAG_OBJECT_TYPE=${TAG_OBJECT%%$'\t'*}
              TAG_OBJECT_SHA=${TAG_OBJECT#*$'\t'}
              TAG_DEPTH=$((TAG_DEPTH + 1))
            done
            [ "$TAG_OBJECT_TYPE" = commit ] || { echo "::error::Release tag does not resolve to a commit."; exit 1; }
            [ "$TAG_OBJECT_SHA" = "$TARGET_SHA" ] || { echo "::error::Existing tag does not point to TARGET_SHA."; exit 1; }
            tag_exists=true
            echo 'tag_exists=true' >> "$GITHUB_OUTPUT"
          else
            STATUS=$(printf '%s\n' "$TAG_RESPONSE" | awk 'NR == 1 { print $2; exit }')
            if [ "$STATUS" = 404 ]; then
              tag_exists=false
              if [ -n "$RECOVERY_VERSION" ]; then
                echo '::error::Recovery requires an existing GitHub Release tag.'
                exit 1
              fi
              echo 'tag_exists=false' >> "$GITHUB_OUTPUT"
              echo 'tag_exists=false' >> "$GITHUB_OUTPUT"
            else
              echo "::error::Could not determine whether release tag exists (HTTP ${STATUS:-unknown})."; exit 1
            fi
          fi

          if [ -n "$RECOVERY_VERSION" ]; then
            [ "$TAG_OBJECT_SHA" = "$TARGET_SHA" ] || { echo '::error::Recovery tag does not point to recovery target SHA.'; exit 1; }
          fi
          # Only an explicit 404 means "missing"; auth, API, and network errors
          # stop here before any tag/release/npm mutation.
          RELEASE_RESPONSE="$RUNNER_TEMP/release-response"
          if gh api --include "repos/$RELEASE_REPO/releases/tags/$VERSION" > "$RELEASE_RESPONSE" 2> "$RUNNER_TEMP/release-error"; then
            RELEASE_STATUS=$(awk 'NR == 1 { print $2; exit }' "$RELEASE_RESPONSE")
            [ "$RELEASE_STATUS" = 200 ] || { echo "::error::Unexpected GitHub release API status: ${RELEASE_STATUS:-unknown}."; exit 1; }
            awk 'BEGIN { body=0 } /^\r?$/ { body=1; next } body { print }' "$RELEASE_RESPONSE" > "$RUNNER_TEMP/release-body"
            RELEASE_BODY="$RUNNER_TEMP/release-body" TARGET_SHA="$TARGET_SHA" VERSION="$VERSION" node <<'NODE'
          const fs = require('node:fs');
          const release = JSON.parse(fs.readFileSync(process.env.RELEASE_BODY, 'utf8'));
          if (release.tag_name !== process.env.VERSION || release.target_commitish !== process.env.TARGET_SHA) {
            console.error('::error::Existing GitHub release is not bound to VERSION and TARGET_SHA.');
            process.exit(1);
          }
          NODE
            released=true
            echo 'released=true' >> "$GITHUB_OUTPUT"
          else
            STATUS=$(awk 'NR == 1 { print $2; exit }' "$RELEASE_RESPONSE")
            if [ "$STATUS" = 404 ]; then
              released=false
              echo 'released=false' >> "$GITHUB_OUTPUT"
            else
              echo "::error::Could not determine whether GitHub release exists (HTTP ${STATUS:-unknown})."; exit 1
            fi
          fi

          if [ -n "$RECOVERY_VERSION" ] && [ "$released" != "true" ]; then
            echo '::error::Recovery requires the existing GitHub Release; it will not create one.'
            exit 1
          fi

          NPM_RESPONSE="$RUNNER_TEMP/npm-response"
          NPM_ERROR="$RUNNER_TEMP/npm-error"
          if [ -n "$RECOVERY_VERSION" ]; then
            NPM_QUERY=(npm view "pantheon-opencode@${VERSION#v}" version --json)
          else
            NPM_QUERY=(npm view pantheon-opencode version --tag "$RELEASE_TAG" --json)
          fi
          if "${NPM_QUERY[@]}" > "$NPM_RESPONSE" 2> "$NPM_ERROR"; then
            NPM_VER=$(tr -d '"[:space:]' < "$NPM_RESPONSE")
            if [ "$NPM_VER" = "${VERSION#v}" ]; then echo 'npm_exists=true' >> "$GITHUB_OUTPUT"; else echo 'npm_exists=false' >> "$GITHUB_OUTPUT"; fi
          elif grep -Eqi 'E404|404[[:space:]]+Not Found|code[[:space:]]+E404' "$NPM_ERROR" "$NPM_RESPONSE"; then
            echo 'npm_exists=false' >> "$GITHUB_OUTPUT"
          else
            echo '::error::Could not determine npm package metadata; refusing to mutate or publish.'; cat "$NPM_ERROR"; exit 1
          fi

      - name: Create and push immutable tag
        if: steps.idem.outputs.released != 'true' && steps.idem.outputs.tag_exists != 'true' && inputs.recovery_version == ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: gh api --method POST "repos/$RELEASE_REPO/git/refs" -f "ref=refs/tags/$VERSION" -f "sha=$TARGET_SHA"

      - name: Create GitHub release
        if: steps.idem.outputs.released != 'true' && inputs.recovery_version == ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_CHANNEL" = "beta" ]; then
            gh release create "$VERSION" --repo "$RELEASE_REPO" --target "$TARGET_SHA" --verify-tag --title "Pantheon $VERSION" --prerelease --notes-file release-artifact/release-notes.md
          else
            gh release create "$VERSION" --repo "$RELEASE_REPO" --target "$TARGET_SHA" --verify-tag --title "Pantheon $VERSION" --notes-file release-artifact/release-notes.md
          fi

      # This is intentionally the final step. The artifact was produced with
      # --ignore-scripts; npm also receives --ignore-scripts as a second guard.
      # No PR checkout or PR-controlled code runs after this token is exposed.
      - name: Publish immutable artifact to npm
        if: steps.idem.outputs.npm_exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.metadata.outputs.version }}
          PACKAGE: ${{ steps.metadata.outputs.package }}
          RELEASE_TAG: ${{ inputs.recovery_version != '' && 'beta' || inputs.release_channel == 'beta' && 'beta' || 'latest' }}
        run: npm publish "$PACKAGE" --ignore-scripts --tag "$RELEASE_TAG" --access public --provenance --registry https://registry.npmjs.org
