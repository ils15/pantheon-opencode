name: Release

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Channel to publish: stable (default) or beta'
        required: false
        type: choice
        default: 'stable'
        options:
          - 'stable'
          - 'beta'
      recovery_version:
        description: 'Existing beta semver prerelease to recover (without v)'
        required: false
        type: string
      recovery_target_sha:
        description: 'Full commit SHA already referenced by the beta tag'
        required: false
        type: string
      recovery_pr_number:
        description: 'Positive PR number encoded in the beta version (legacy format only)'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

# Every run is an explicit operator action (workflow_dispatch). Validation
# runs on the checked-out ref, so it never receives a release credential. The
# release job consumes only the immutable artifact produced by that job and has
# write permissions solely because it performs the release.
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EVENT_NAME: ${{ github.event_name }}
      RELEASE_CHANNEL: ${{ inputs.release_channel }}
      PANTHEON_RELEASE_CONTEXT: '1'
      RECOVERY_VERSION: ${{ inputs.recovery_version }}
      RECOVERY_TARGET_SHA: ${{ inputs.recovery_target_sha }}
      RECOVERY_PR_NUMBER: ${{ inputs.recovery_pr_number }}
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_target_sha || github.sha }}
      # The measured host evidence for this release: boundary testing — the
      # oldest supported 2.x member and the newest (host APIs move
      # monotonically, so the boundaries catch shape drift the middle minors
      # cannot hide). Every OpenCode 2.x minor is supported; the middle hosts
      # stay exercised in development and can be restored here when a release
      # wants the full measured set. Changing the set requires editing this
      # workflow, so the frozen evidence is reviewable in the diff; the
      # known-broken host 2.0.22 must not appear and is rejected by the gate.
      PANTHEON_RELEASE_MATRIX: >-
        [{"host":"2.0.29","line":"2.x","kind":"sandbox-v2"},
        {"host":"2.1.3","line":"2.x","kind":"sandbox-v2"}]
    steps:
      # This is deliberately the first step. In particular, no release
      # mutation can be reached before the recovery inputs are a coherent set.
      - name: Validate release inputs before checkout
        run: |
          set -euo pipefail
          RECOVERY_VERSION="$RECOVERY_VERSION" RECOVERY_TARGET_SHA="$RECOVERY_TARGET_SHA" RECOVERY_PR_NUMBER="$RECOVERY_PR_NUMBER" EVENT_NAME="$EVENT_NAME" node <<'NODE'
          const version = process.env.RECOVERY_VERSION ?? '';
          const sha = process.env.RECOVERY_TARGET_SHA ?? '';
          const pr = process.env.RECOVERY_PR_NUMBER ?? '';
          const supplied = [version, sha, pr].filter(Boolean).length;
          if (process.env.EVENT_NAME !== 'workflow_dispatch' && supplied) throw new Error('Recovery inputs are only valid for workflow_dispatch.');
          if (version || sha) {
            if (!version || !sha) throw new Error('Recovery requires both recovery_version and recovery_target_sha.');
            // Accept the committed sequential scheme (X.Y.Z-beta.N, current) and
            // the legacy PR+SHA scheme (X.Y.Z-beta.<pr>.<7-char-sha>). The new
            // scheme encodes no PR or SHA, so recovery_pr_number is optional.
            const modern = /^(\d+\.\d+\.\d+)-(?:beta|rc)\.([1-9]\d*)$/.exec(version);
            const legacy = /^(\d+\.\d+\.\d+)-(?:beta|rc)\.(\d+)\.([0-9a-f]{7})$/.exec(version);
            if (!modern && !legacy) throw new Error('Recovery version must be <base>-(beta|rc).<N> or legacy <base>-(beta|rc).<pr>.<7-char-lowercase-sha>.');
            if (pr && !legacy) throw new Error('recovery_pr_number is only valid for the legacy <base>-beta.<pr>.<sha7> format.');
            if (!/^[0-9a-fA-F]{40}$/.test(sha)) throw new Error('Recovery target SHA must be a full 40-hex SHA.');
            if (legacy) {
              const value = Number(pr);
              if (!/^\d+$/.test(pr) || !Number.isSafeInteger(value) || value <= 0) throw new Error('Recovery PR number must be a positive safe integer.');
              if (legacy[2] !== pr) throw new Error('Recovery version PR must match recovery_pr_number.');
              if (legacy[3] !== sha.slice(0, 7).toLowerCase()) throw new Error('Recovery version SHA suffix must match recovery_target_sha.');
            }
          } else if (pr) {
            throw new Error('recovery_pr_number requires recovery_version and recovery_target_sha.');
          }
          NODE
          case "$RELEASE_CHANNEL" in
            stable|beta) : ;;
            *) echo "::error::release_channel must be 'stable' or 'beta'."; exit 1 ;;
          esac
          case "$TARGET_SHA" in
            ''|*[!0-9a-fA-F]*) echo "::error::Target SHA must be hexadecimal."; exit 1 ;;
          esac
          [ "${#TARGET_SHA}" -eq 40 ] || { echo "::error::Target SHA must be 40 characters."; exit 1; }

      - name: Assert validation has no release credentials
        run: |
          set -euo pipefail
          test -z "${NODE_AUTH_TOKEN:-}" || { echo "::error::Validation received NODE_AUTH_TOKEN."; exit 1; }
          test -z "${NPM_TOKEN:-}" || { echo "::error::Validation received NPM_TOKEN."; exit 1; }
          test -z "${RELEASE_TOKEN:-}" || { echo "::error::Validation received RELEASE_TOKEN."; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm checkout matches TARGET_SHA
        run: |
          set -euo pipefail
          EXPECTED_SHA="${TARGET_SHA,,}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ] || {
            echo "::error::Checked out commit does not match TARGET_SHA."
            exit 1
          }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.4.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            src/mcp/requirements-mcp.txt
            src/mcp/requirements-vision.txt

      # Dispatched ref code is untrusted. No lifecycle script is allowed to run
      # in this job.
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Install release-gate test dependencies (isolated venv)
        # Gate (a) imports fastmcp/mcp at collection time, so the pins in
        # src/mcp/requirements-mcp.txt are part of the test contract, not a
        # convenience. The venv keeps the runner's ambient site-packages (and
        # any preinstalled fastmcp) out of the verdict, and PANTHEON_PYTHON
        # makes the gate use this interpreter or fail — never fall back to the
        # ambient python3. Everything here is fail-closed: `set -euo pipefail`
        # plus an explicit pin assertion, so a broken install aborts the job
        # instead of degrading pytest into a non-verdict or a false failure.
        run: |
          set -euo pipefail
          GATE_VENV="$RUNNER_TEMP/gate-venv"
          rm -rf "$GATE_VENV"
          python3 -m venv "$GATE_VENV"
          "$GATE_VENV/bin/python" -m pip install --quiet --upgrade pip
          "$GATE_VENV/bin/python" -m pip install --quiet coverage pytest pyyaml
          "$GATE_VENV/bin/python" -m pip install --quiet pytest-asyncio==1.3.0
          "$GATE_VENV/bin/python" -m pip install --quiet -r src/mcp/requirements-mcp.txt -r src/mcp/requirements-vision.txt
          "$GATE_VENV/bin/python" -m pip check
          "$GATE_VENV/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import pathlib
          import sys

          mismatches = []
          for requirements in ('src/mcp/requirements-mcp.txt', 'src/mcp/requirements-vision.txt'):
              for raw in pathlib.Path(requirements).read_text(encoding='utf-8').splitlines():
                  line = raw.split('#', 1)[0].strip()
                  if not line:
                      continue
                  name, _, pin = line.partition('==')
                  if not pin:
                      mismatches.append(f'{name}: not an exact pin')
                      continue
                  try:
                      installed = metadata.version(name)
                  except metadata.PackageNotFoundError:
                      mismatches.append(f'{name}: not installed')
                      continue
                  if installed != pin:
                      mismatches.append(f'{name}=={installed} (expected {pin})')
          if mismatches:
              sys.exit('pinned requirements are not satisfied: ' + '; '.join(mismatches))
          PY
          echo "PANTHEON_PYTHON=$GATE_VENV/bin/python" >> "$GITHUB_ENV"
          "$GATE_VENV/bin/python" --version

      - name: Determine release type
        id: type
        run: |
          set -euo pipefail
          if [ -n "$RECOVERY_VERSION" ]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "tag=beta" >> "$GITHUB_OUTPUT"
            echo "recovery=true" >> "$GITHUB_OUTPUT"
          else
            echo "channel=$RELEASE_CHANNEL" >> "$GITHUB_OUTPUT"
            if [ "$RELEASE_CHANNEL" = "beta" ]; then
              echo "tag=beta" >> "$GITHUB_OUTPUT"
            else
              echo "tag=latest" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Apply exact recovery version
        if: steps.type.outputs.recovery == 'true'
        run: |
          set -euo pipefail
          # The recovery case may run on a checkout that ALREADY carries the
          # recovered version committed (tag/publish backed without the
          # ceremony); npm version refuses an unchanged version by default.
          npm version "$RECOVERY_VERSION" --no-git-tag-version --ignore-scripts --allow-same-version >/dev/null
          node scripts/version-check.mjs --fix

      - name: Version gate
        id: version_gate
        env:
          GATE_CHANNEL: ${{ steps.type.outputs.channel }}
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const pkgVer = String(JSON.parse(fs.readFileSync('package.json', 'utf8')).version || '');
          const channel = process.env.GATE_CHANNEL || 'stable';
          const stable = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          // Committed sequential beta line only. The version is never computed
          // at release time, so the gate trusts the manifest version as-is.
          const beta = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)-(?:beta|rc)\.[1-9]\d*$/;
          if (process.env.RECOVERY_VERSION) {
            if (pkgVer !== process.env.RECOVERY_VERSION) {
              console.error('::error::Recovery package version was not applied exactly.');
              process.exit(1);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkgVer}\nlatest_stable=v${pkgVer}\n`);
            process.exit(0);
          }
          const tags = execFileSync('git', ['tag', '-l', 'v[0-9]*'], { encoding: 'utf8' })
            .trim().split('\n').filter(Boolean).filter((t) => /^v\d+\.\d+\.\d+$/.test(t));
          const cmp = (a, b) => {
            const pa = a.split('.').map(Number); const pb = b.split('.').map(Number);
            for (let i = 0; i < 3; i++) if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) > (pb[i] || 0) ? 1 : -1;
            return 0;
          };
          tags.sort((a, b) => cmp(a.slice(1), b.slice(1)));
          const latest = tags.length ? tags.at(-1) : 'v0.0.0';
          if (channel === 'beta') {
            if (!beta.test(pkgVer)) {
              console.error(`::error::Beta version gate failed: ${pkgVer}. Expected a committed X.Y.Z-beta.N version.`);
              process.exit(1);
            }
          } else if (!stable.test(pkgVer) || cmp(pkgVer, latest.slice(1)) < 0) {
            console.error(`::error::Version gate failed: ${pkgVer} (latest stable ${latest}).`);
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkgVer}\nlatest_stable=${latest}\n`);
          NODE

      # ── Five release gates (ADR-0014; unit/install suites run in ci.yml) ──
      # Every gate prints `GATE <name>: PASS` and writes a named evidence file.
      # A gate that cannot run is a failure; no gate degrades to a weaker result.

      - name: Gate (f) metadata
        env:
          GATE_VERSION: ${{ steps.version_gate.outputs.version }}
          GATE_CHANNEL: ${{ steps.type.outputs.channel }}
          GATE_RECOVERY: ${{ steps.type.outputs.recovery }}
        run: |
          set -euo pipefail
          args=(metadata --evidence-dir "$RUNNER_TEMP/gate-evidence" --version "$GATE_VERSION" --channel "$GATE_CHANNEL" --target-sha "$TARGET_SHA")
          if [ "$GATE_RECOVERY" = "true" ]; then args+=(--recovery); fi
          node scripts/release-gates.mjs "${args[@]}"

      - name: Gate (e) changelog
        env:
          GATE_VERSION: ${{ steps.version_gate.outputs.version }}
          GATE_RECOVERY: ${{ steps.type.outputs.recovery }}
        run: |
          set -euo pipefail
          args=(changelog --evidence-dir "$RUNNER_TEMP/gate-evidence" --version "$GATE_VERSION")
          if [ "$GATE_RECOVERY" = "true" ]; then args+=(--recovery); fi
          node scripts/release-gates.mjs "${args[@]}"

      # The full node/ts/python suites are NOT re-run here: ci.yml already
      # ran them on this exact SHA at merge time, and that evidence travels
      # with the commit. The release gates cover only what CI cannot: a real
      # host sandbox, a real user install, the packaged payload, and the
      # changelog/metadata contract.

      - name: Create release artifact and notes
        env:
          BASE_VERSION: ${{ steps.version_gate.outputs.version }}
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
          RELEASE_CHANNEL: ${{ steps.type.outputs.channel }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-artifact"
          # Notes come from the committed CHANGELOG.md for BOTH channels, then
          # ALWAYS flow through scripts/release-body.mjs. That composer already
          # handles every body shape — curated page, canonical-only (no page),
          # empty curated page, beta and recovery — so anything it appends
          # (e.g. the concept-DOI citation footer) is unconditional. Gating the
          # composer on "stable + a curated docs/releases/vX.Y.Z.md exists" was
          # what shipped a bare changelog body for releases without a page.
          if [ -n "$RECOVERY_VERSION" ]; then
            if node scripts/changelog-extract.mjs "v$RECOVERY_VERSION" > "$RUNNER_TEMP/release-notes.md" 2>/dev/null && [ -s "$RUNNER_TEMP/release-notes.md" ]; then
              echo "Recovery notes extracted from the CHANGELOG section of v$RECOVERY_VERSION."
            else
              echo "No CHANGELOG section for v$RECOVERY_VERSION — publishing the static recovery note."
              printf '%s\n' "Recovery publish for existing tag $RECOVERY_VERSION." > "$RUNNER_TEMP/release-notes.md"
            fi
            node scripts/release-body.mjs \
              --version "$RECOVERY_VERSION" \
              --channel "$RELEASE_CHANNEL" \
              --recovery \
              --changelog-notes "$RUNNER_TEMP/release-notes.md" \
              --repo "$RELEASE_REPO" \
              --ref "v$RECOVERY_VERSION" \
              --out "$RUNNER_TEMP/release-notes.md"
          else
            if ! node scripts/changelog-extract.mjs "$BASE_VERSION" > "$RUNNER_TEMP/release-notes.md"; then
              echo "::error::CHANGELOG.md has no [$BASE_VERSION] section."; exit 1
            fi
            node scripts/release-body.mjs \
              --version "$BASE_VERSION" \
              --channel "$RELEASE_CHANNEL" \
              --changelog-notes "$RUNNER_TEMP/release-notes.md" \
              --repo "$RELEASE_REPO" \
              --ref "v$BASE_VERSION" \
              --out "$RUNNER_TEMP/release-notes.md"
          fi
          npm run package:evidence -- --output-dir="$RUNNER_TEMP/release-artifact" --target-sha="$TARGET_SHA" > "$RUNNER_TEMP/package-evidence.json"
          TARBALLS=("$RUNNER_TEMP/release-artifact"/*.tgz)
          [ "${#TARBALLS[@]}" -eq 1 ] && [ -f "${TARBALLS[0]}" ] || {
            echo "::error::Package evidence must contain exactly one .tgz."
            exit 1
          }
          METADATA_PATH="$RUNNER_TEMP/release-artifact/metadata.json" TARGET_SHA="$TARGET_SHA" TARBALL="${TARBALLS[0]}" node <<'NODE'
          const { createHash } = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const metadata = JSON.parse(fs.readFileSync(process.env.METADATA_PATH, 'utf8'));
          const targetSha = String(process.env.TARGET_SHA || '').trim().toLowerCase();
          const tarball = process.env.TARBALL;
          const actualSha = createHash('sha256').update(fs.readFileSync(tarball)).digest('hex');
          if (!/^\d+\.\d+\.\d+(?:-(?:beta|rc)\.[1-9]\d*(?:\.[0-9a-f]+)?)?$/.test(metadata.version || '')) throw new Error('Invalid package evidence version.');
          if (metadata.targetSha !== targetSha) throw new Error('Package evidence target SHA does not match TARGET_SHA.');
          if (!/^[0-9a-f]{64}$/.test(metadata.tarballSha256 || '') || metadata.tarballSha256 !== actualSha) throw new Error('Package evidence tarball SHA-256 is invalid.');
          if (metadata.tarball !== path.basename(tarball)) throw new Error('Package evidence tarball name is invalid.');
          NODE
          cp "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/release-artifact/release-notes.md"

      - name: Restore development dependencies for the remaining gates
        # Gate (d) re-runs `package:validate`, which imports esbuild (a
        # devDependency) for the committed decision-router bundle drift check.
        # The evidence step above proves a production-only install works and
        # leaves the checkout pruned by `npm ci --omit=dev`, so the full install
        # is restored from the same lockfile before the gates run. The artifact
        # is already built and hashed: nothing is repacked after this point.
        run: npm ci --ignore-scripts

      # Sandbox npm/pip caches point at the runner's default dirs — the ones
      # setup-node/setup-python restore and save per run — so the sandbox
      # installs stop paying cold-cache downloads. Content-addressed caches:
      # stale entries fail closed, never mask an incompatibility.
      - name: Gate (d) package
        run: |
          set -euo pipefail
          node scripts/release-gates.mjs package --evidence-dir "$RUNNER_TEMP/gate-evidence" --artifact-dir "$RUNNER_TEMP/release-artifact" --version "$BASE_VERSION" --target-sha "$TARGET_SHA"
        env:
          BASE_VERSION: ${{ steps.version_gate.outputs.version }}

      - name: Gate (c) install
        run: |
          set -euo pipefail
          node scripts/release-gates.mjs install --evidence-dir "$RUNNER_TEMP/gate-evidence" --artifact-dir "$RUNNER_TEMP/release-artifact" --version "$BASE_VERSION" --target-sha "$TARGET_SHA"
        env:
          BASE_VERSION: ${{ steps.version_gate.outputs.version }}
          PANTHEON_V2_HANDSHAKE_TIMEOUT: '180'

      - name: Gate (b) host compatibility
        timeout-minutes: 25
        run: |
          set -euo pipefail
          node scripts/release-gates.mjs host --evidence-dir "$RUNNER_TEMP/gate-evidence" --artifact-dir "$RUNNER_TEMP/release-artifact" --version "$BASE_VERSION" --target-sha "$TARGET_SHA"
        env:
          BASE_VERSION: ${{ steps.version_gate.outputs.version }}
          PANTHEON_V2_HANDSHAKE_TIMEOUT: '180'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/release-artifact
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-gate-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/gate-evidence
          if-no-files-found: ignore
          retention-days: 90

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      EVENT_NAME: ${{ github.event_name }}
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_target_sha || github.sha }}
      RECOVERY_VERSION: ${{ inputs.recovery_version }}
      RECOVERY_TARGET_SHA: ${{ inputs.recovery_target_sha }}
      RECOVERY_PR_NUMBER: ${{ inputs.recovery_pr_number }}
      RELEASE_REPO: ${{ github.repository }}
      # Recovery and beta channel are beta publishes; stable dispatch is latest.
      RELEASE_TAG: ${{ inputs.recovery_version != '' && 'beta' || inputs.release_channel == 'beta' && 'beta' || 'latest' }}
    steps:
      # Defense in depth: this step must remain before every gh/tag/npm
      # mutation in this job. It does not inspect or execute the artifact.
      - name: Revalidate release inputs before mutations
        run: |
          set -euo pipefail
          RELEASE_REPO="$RELEASE_REPO" node <<'NODE'
          const repo = process.env.RELEASE_REPO ?? '';
          if (!/^[A-Za-z0-9][A-Za-z0-9_.-]*\/[A-Za-z0-9][A-Za-z0-9_.-]*$/.test(repo)) {
            throw new Error('RELEASE_REPO must be an owner/name GitHub repository.');
          }
          NODE
          RECOVERY_VERSION="$RECOVERY_VERSION" RECOVERY_TARGET_SHA="$RECOVERY_TARGET_SHA" RECOVERY_PR_NUMBER="$RECOVERY_PR_NUMBER" node <<'NODE'
          const values = [process.env.RECOVERY_VERSION ?? '', process.env.RECOVERY_TARGET_SHA ?? '', process.env.RECOVERY_PR_NUMBER ?? ''];
          const [version, sha, pr] = values;
          if ((version || sha) && (!version || !sha)) throw new Error('Recovery requires both recovery_version and recovery_target_sha.');
          if (!version && !sha && pr) throw new Error('recovery_pr_number requires recovery_version and recovery_target_sha.');
          if (version) {
            // Modern X.Y.Z-beta.N encodes no PR/SHA; the legacy
            // X.Y.Z-beta.<pr>.<sha7> form still requires all three inputs.
            const modern = /^(\d+\.\d+\.\d+)-(?:beta|rc)\.([1-9]\d*)$/.exec(version);
            const legacy = /^(\d+\.\d+\.\d+)-(?:beta|rc)\.(\d+)\.([0-9a-f]{7})$/.exec(version);
            if (!modern && !legacy) throw new Error('Invalid recovery version.');
            if (pr && !legacy) throw new Error('recovery_pr_number is only valid for the legacy <base>-beta.<pr>.<sha7> format.');
            if (!/^[0-9a-fA-F]{40}$/.test(sha)) throw new Error('Invalid recovery SHA.');
            if (legacy) {
              if (!/^\d+$/.test(pr) || !Number.isSafeInteger(Number(pr)) || Number(pr) <= 0) throw new Error('Invalid recovery PR number.');
              if (legacy[2] !== pr) throw new Error('Recovery version PR must match recovery_pr_number.');
              if (legacy[3] !== sha.slice(0, 7).toLowerCase()) throw new Error('Recovery version SHA suffix must match recovery_target_sha.');
            }
          }
          NODE
          if [ -n "$RECOVERY_VERSION" ]; then
            [ "$EVENT_NAME" = "workflow_dispatch" ] || { echo '::error::Recovery requires workflow_dispatch.'; exit 1; }
            TARGET_SHA="$RECOVERY_TARGET_SHA"
          fi
          TARGET_SHA=$(printf '%s' "$TARGET_SHA" | tr '[:upper:]' '[:lower:]')
          case "$TARGET_SHA" in ''|*[!0-9a-fA-F]*) echo "::error::Target SHA must be hexadecimal."; exit 1 ;; esac
          [ "${#TARGET_SHA}" -eq 40 ] || { echo "::error::Target SHA must be 40 characters."; exit 1; }
          printf 'TARGET_SHA=%s\n' "$TARGET_SHA" >> "$GITHUB_ENV"

      # v8 keeps the single-named-artifact layout (extract directly into
      # `path`); `digest-mismatch` now defaults to `error`, which strengthens
      # the integrity check on the release tarball.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-inputs-${{ github.run_id }}
          path: release-artifact

      - name: Validate immutable artifact metadata
        id: metadata
        run: |
          set -euo pipefail
          TARBALLS=(release-artifact/*.tgz)
          [ "${#TARBALLS[@]}" -eq 1 ] && [ -f "${TARBALLS[0]}" ] || {
            echo "::error::Release artifact must contain exactly one .tgz."
            exit 1
          }
          PACKAGE=$(realpath -- "${TARBALLS[0]}")
          [ -f "$PACKAGE" ] || { echo "::error::Release package artifact path is invalid."; exit 1; }
          tar -tzf "$PACKAGE" > "$RUNNER_TEMP/package-contents" || {
            echo "::error::Release package artifact is not a readable tarball."; exit 1;
          }
          grep -Fxq 'package/package.json' "$RUNNER_TEMP/package-contents" || {
            echo "::error::Release package artifact is not an npm package tarball."; exit 1;
          }
          tar -xOzf "$PACKAGE" package/package.json > "$RUNNER_TEMP/package.json" || {
            echo "::error::Could not read package metadata from release artifact."; exit 1;
          }
          METADATA_VALUES=$(METADATA_PATH=release-artifact/metadata.json TARGET_SHA="$TARGET_SHA" PACKAGE="$PACKAGE" PACKAGE_JSON="$RUNNER_TEMP/package.json" node <<'NODE'
          const { createHash } = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const metadata = JSON.parse(fs.readFileSync(process.env.METADATA_PATH, 'utf8'));
          const packageJson = JSON.parse(fs.readFileSync(process.env.PACKAGE_JSON, 'utf8'));
          const expectedTarget = String(process.env.TARGET_SHA || '').trim().toLowerCase();
          const actualSha = createHash('sha256').update(fs.readFileSync(process.env.PACKAGE)).digest('hex');
          if (!/^\d+\.\d+\.\d+(?:-(?:beta|rc)\.[1-9]\d*(?:\.[0-9a-f]+)?)?$/.test(metadata.version || '')) throw new Error('Invalid artifact version.');
          if (!/^[0-9a-f]{40}$/.test(metadata.targetSha || '') || metadata.targetSha !== expectedTarget) throw new Error('Artifact target SHA does not match TARGET_SHA.');
          if (!/^[0-9a-f]{64}$/.test(metadata.tarballSha256 || '') || metadata.tarballSha256 !== actualSha) throw new Error('Downloaded tarball SHA-256 does not match metadata.');
          if (metadata.tarball !== path.basename(process.env.PACKAGE)) throw new Error('Artifact metadata tarball name does not match the downloaded file.');
          if (packageJson.name !== 'pantheon-opencode' || packageJson.version !== metadata.version) throw new Error('Release tarball package metadata does not match the validated artifact.');
          for (const [file, expected] of [['version', metadata.version], ['target-sha', metadata.targetSha], ['tarball-sha256', metadata.tarballSha256]]) {
            if (fs.readFileSync(path.join('release-artifact', file), 'utf8').trim() !== expected) throw new Error(`Artifact ${file} does not match metadata.`);
          }
          process.stdout.write(`${metadata.version}\t${metadata.targetSha}\t${metadata.tarballSha256}`);
          NODE
          )
          IFS=$'\t' read -r VERSION ARTIFACT_SHA TARBALL_SHA256 <<< "$METADATA_VALUES"
          [ -n "$VERSION" ] && [ "$ARTIFACT_SHA" = "${TARGET_SHA,,}" ] && [ "${#TARBALL_SHA256}" -eq 64 ] || {
            echo "::error::Artifact metadata output is malformed."; exit 1;
          }
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

      # NOTE: no `cache: npm` here on purpose — this job never checks out the
      # repository (it consumes only the validated artifact), so there is no
      # package-lock.json for setup-node to hash and the cache would fail.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.4.0'
          registry-url: https://registry.npmjs.org

      # Node 26.4.0 bundles npm 11.17.0, whose `lib/commands/dist-tag.js` never
      # runs the OIDC exchange, so `npm dist-tag add` sends NODE_AUTH_TOKEN
      # verbatim. Only `lib/commands/publish.js` called `lib/utils/oidc.js`
      # before 11.21.0, which is why the published release still failed E401 on
      # a dead ~117-day-old GAT (run 46120900422) even though `publish` itself
      # succeeded over OIDC.
      #
      # Proof — fetched each version's tarball and ran
      # `grep -n oidc package/lib/commands/dist-tag.js` on the extracted tree:
      #   11.17.0  (bundled with Node 26.4.0)  0 matches
      #   11.19.1                             0 matches
      #   11.20.0                             0 matches
      #   11.21.0                             6 matches — lines 6 (require),
      #                                       105 (add), 135 (remove),
      #                                       169 (list), 210/212 (#oidc)
      #   11.21.3                             identical file (empty diff)
      #   12.2.3                              identical file (empty diff)
      # 11.21.0 is the first published version that carries the exchange; the
      # 11.21.x line is byte-identical through 11.21.3 and again in 12.2.3.
      # 11.21.3's engines field is "^20.17.0 || >=22.9.0", satisfied by the
      # job's Node 26.4.0, and a `--prefix` install on 26.4.0 was exercised:
      # the installed dist-tag.js greps clean.
      #
      # Scoped to this job on purpose: `ci.yml` and local dev keep the npm that
      # ships with Node, because only the release job needs the OIDC dist-tag.
      - name: Pin npm for OIDC-capable dist-tag
        run: |
          set -euo pipefail
          npm i -g npm@11.21.3
          npm --version
          # Fail here, not on a 403/E401 later, if the installed npm lost the
          # exchange. This is the same grep the pin was chosen with.
          NPM_GLOBAL_ROOT="$(npm root -g)"
          grep -q 'this.#oidc(spec, opts)' "$NPM_GLOBAL_ROOT/npm/lib/commands/dist-tag.js" || {
            echo "::error::npm $(npm --version) has no OIDC exchange in dist-tag.js; the pinned version is wrong."
            exit 1
          }

      - name: Check idempotency
        id: idem
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          TAG_REF="$VERSION"
          if [ -n "$RECOVERY_VERSION" ]; then
            EXPECTED_TAG="v${RECOVERY_VERSION}"
            [ "$TAG_REF" = "$EXPECTED_TAG" ] || { echo '::error::Recovery artifact version differs from requested version.'; exit 1; }
            fi

          TAG_OBJECT_SHA=""
          TAG_REF="$TAG_REF" node <<'NODE'
          const tag = process.env.TAG_REF ?? '';
          if (!/^v\d+\.\d+\.\d+(?:-(?:beta|rc)\.[1-9]\d*(?:\.[0-9a-f]+)?)?$/.test(tag)) {
            throw new Error('Release tag ref is invalid.');
          }
          NODE
          if TAG_RESPONSE=$(gh api "repos/$RELEASE_REPO/git/ref/tags/$TAG_REF" --include 2>"$RUNNER_TEMP/tag-ref-error"); then
            TAG_STATUS=$(printf '%s\n' "$TAG_RESPONSE" | awk 'NR == 1 { print $2; exit }')
            [ "$TAG_STATUS" = 200 ] || { echo "::error::Unexpected GitHub tag API status: ${TAG_STATUS:-unknown}."; exit 1; }
            printf '%s\n' "$TAG_RESPONSE" | awk 'BEGIN { body=0 } /^\r?$/ { body=1; next } body { print }' > "$RUNNER_TEMP/tag-ref-body"
            TAG_OBJECT=$(TAG_BODY="$RUNNER_TEMP/tag-ref-body" node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.env.TAG_BODY, 'utf8'));
          const object = body.object ?? body;
          const sha = String(object.sha ?? '').trim().toLowerCase();
          if (!['tag', 'commit'].includes(object.type) || !/^[0-9a-f]{40}$/.test(sha)) {
            throw new Error('GitHub tag API returned an invalid object.');
          }
          process.stdout.write(`${object.type}\t${sha}`);
          NODE
            )
            TAG_OBJECT_TYPE=${TAG_OBJECT%%$'\t'*}
            TAG_OBJECT_SHA=${TAG_OBJECT#*$'\t'}
            TAG_DEPTH=0
            while [ "$TAG_OBJECT_TYPE" = tag ]; do
              [ "$TAG_DEPTH" -lt 4 ] || { echo '::error::Annotated tag nesting is too deep.'; exit 1; }
              TAG_RESPONSE=$(gh api "repos/$RELEASE_REPO/git/tags/$TAG_OBJECT_SHA" --include 2>"$RUNNER_TEMP/tag-object-error") || { echo '::error::Could not resolve annotated tag object.'; cat "$RUNNER_TEMP/tag-object-error"; exit 1; }
              TAG_STATUS=$(printf '%s\n' "$TAG_RESPONSE" | awk 'NR == 1 { print $2; exit }')
              [ "$TAG_STATUS" = 200 ] || { echo "::error::Unexpected GitHub tag object API status: ${TAG_STATUS:-unknown}."; exit 1; }
              printf '%s\n' "$TAG_RESPONSE" | awk 'BEGIN { body=0 } /^\r?$/ { body=1; next } body { print }' > "$RUNNER_TEMP/tag-object-body"
              TAG_OBJECT=$(TAG_BODY="$RUNNER_TEMP/tag-object-body" node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.env.TAG_BODY, 'utf8'));
          const object = body.object;
          const sha = String(object?.sha ?? '').trim().toLowerCase();
          if (!object || !['tag', 'commit'].includes(object.type) || !/^[0-9a-f]{40}$/.test(sha)) {
            throw new Error('GitHub annotated tag API returned an invalid object.');
          }
          process.stdout.write(`${object.type}\t${sha}`);
          NODE
              )
              TAG_OBJECT_TYPE=${TAG_OBJECT%%$'\t'*}
              TAG_OBJECT_SHA=${TAG_OBJECT#*$'\t'}
              TAG_DEPTH=$((TAG_DEPTH + 1))
            done
            [ "$TAG_OBJECT_TYPE" = commit ] || { echo "::error::Release tag does not resolve to a commit."; exit 1; }
            [ "$TAG_OBJECT_SHA" = "$TARGET_SHA" ] || { echo "::error::Existing tag does not point to TARGET_SHA."; exit 1; }
            tag_exists=true
            echo 'tag_exists=true' >> "$GITHUB_OUTPUT"
          else
            STATUS=$(printf '%s\n' "$TAG_RESPONSE" | awk 'NR == 1 { print $2; exit }')
            if [ "$STATUS" = 404 ]; then
              tag_exists=false
              if [ -n "$RECOVERY_VERSION" ]; then
                echo '::error::Recovery requires an existing git tag.'
                exit 1
              fi
              echo 'tag_exists=false' >> "$GITHUB_OUTPUT"
              echo 'tag_exists=false' >> "$GITHUB_OUTPUT"
            else
              echo "::error::Could not determine whether release tag exists (HTTP ${STATUS:-unknown})."; exit 1
            fi
          fi

          if [ -n "$RECOVERY_VERSION" ]; then
            [ "$TAG_OBJECT_SHA" = "$TARGET_SHA" ] || { echo '::error::Recovery tag does not point to recovery target SHA.'; exit 1; }
          fi
          # Only an explicit 404 means "missing"; auth, API, and network errors
          # stop here before any tag/release/npm mutation.
          RELEASE_RESPONSE="$RUNNER_TEMP/release-response"
          if gh api --include "repos/$RELEASE_REPO/releases/tags/$VERSION" > "$RELEASE_RESPONSE" 2> "$RUNNER_TEMP/release-error"; then
            RELEASE_STATUS=$(awk 'NR == 1 { print $2; exit }' "$RELEASE_RESPONSE")
            [ "$RELEASE_STATUS" = 200 ] || { echo "::error::Unexpected GitHub release API status: ${RELEASE_STATUS:-unknown}."; exit 1; }
            awk 'BEGIN { body=0 } /^\r?$/ { body=1; next } body { print }' "$RELEASE_RESPONSE" > "$RUNNER_TEMP/release-body"
            RELEASE_BODY="$RUNNER_TEMP/release-body" TARGET_SHA="$TARGET_SHA" VERSION="$VERSION" node <<'NODE'
          const fs = require('node:fs');
          const release = JSON.parse(fs.readFileSync(process.env.RELEASE_BODY, 'utf8'));
          if (release.tag_name !== process.env.VERSION || release.target_commitish !== process.env.TARGET_SHA) {
            console.error('::error::Existing GitHub release is not bound to VERSION and TARGET_SHA.');
            process.exit(1);
          }
          // The published body must equal the canonical CHANGELOG section (the
          // validated artifact's release-notes.md). A hand-edited body breaks
          // the release-notes contract and fails the re-run with the remedy.
          const published = String(release.body ?? '').replace(/\s+$/, '');
          const notesPath = 'release-artifact/release-notes.md';
          const canonical = fs.existsSync(notesPath)
            ? fs.readFileSync(notesPath, 'utf8').replace(/\s+$/, '')
            : null;
          if (canonical !== null && published !== canonical) {
            console.error(
              '::error::Published release body diverges from the canonical CHANGELOG section ' +
              '(release-artifact/release-notes.md). Restore it with ' +
              '`gh release edit ' + process.env.VERSION + ' --notes-file release-artifact/release-notes.md`.',
            );
            process.exit(1);
          }
          NODE
            released=true
            echo 'released=true' >> "$GITHUB_OUTPUT"
          else
            STATUS=$(awk 'NR == 1 { print $2; exit }' "$RELEASE_RESPONSE")
            if [ "$STATUS" = 404 ]; then
              released=false
              echo 'released=false' >> "$GITHUB_OUTPUT"
            else
              echo "::error::Could not determine whether GitHub release exists (HTTP ${STATUS:-unknown})."; exit 1
            fi
          fi

          # Beta creates no GitHub Release, so recovery is bound to the git tag
          # only (already required above). A 404 release lookup above is the
          # expected state for a beta and must not block the npm republish.

          NPM_RESPONSE="$RUNNER_TEMP/npm-response"
          NPM_ERROR="$RUNNER_TEMP/npm-error"
          if [ -n "$RECOVERY_VERSION" ]; then
            NPM_QUERY=(npm view "pantheon-opencode@${VERSION#v}" version --json)
          else
            NPM_QUERY=(npm view pantheon-opencode version --tag "$RELEASE_TAG" --json)
          fi
          if "${NPM_QUERY[@]}" > "$NPM_RESPONSE" 2> "$NPM_ERROR"; then
            NPM_VER=$(tr -d '"[:space:]' < "$NPM_RESPONSE")
            if [ "$NPM_VER" = "${VERSION#v}" ]; then echo 'npm_exists=true' >> "$GITHUB_OUTPUT"; else echo 'npm_exists=false' >> "$GITHUB_OUTPUT"; fi
          elif grep -Eqi 'E404|404[[:space:]]+Not Found|code[[:space:]]+E404' "$NPM_ERROR" "$NPM_RESPONSE"; then
            echo 'npm_exists=false' >> "$GITHUB_OUTPUT"
          else
            echo '::error::Could not determine npm package metadata; refusing to mutate or publish.'; cat "$NPM_ERROR"; exit 1
          fi

      - name: Create and push immutable tag
        if: steps.idem.outputs.released != 'true' && steps.idem.outputs.tag_exists != 'true' && inputs.recovery_version == ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: gh api --method POST "repos/$RELEASE_REPO/git/refs" -f "ref=refs/tags/$VERSION" -f "sha=$TARGET_SHA"

      # Only the stable channel creates a GitHub Release. The official Zenodo
      # GitHub integration archives every Release (pre-releases included), so a
      # beta Release would add an unwanted version to the Zenodo family. Beta
      # keeps its git tag for by-tag recovery and publishes npm only.
      - name: Create GitHub release
        if: steps.idem.outputs.released != 'true' && inputs.recovery_version == '' && inputs.release_channel != 'beta'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" --repo "$RELEASE_REPO" --target "$TARGET_SHA" --verify-tag --title "Pantheon $VERSION" --notes-file release-artifact/release-notes.md

      # This is intentionally the final step. The artifact was produced with
      # --ignore-scripts; npm also receives --ignore-scripts as a second guard.
      # No PR checkout or PR-controlled code runs after this token is exposed.
      - name: Publish immutable artifact to npm
        if: steps.idem.outputs.npm_exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.metadata.outputs.version }}
          PACKAGE: ${{ steps.metadata.outputs.package }}
          RELEASE_TAG: ${{ inputs.recovery_version != '' && 'beta' || inputs.release_channel == 'beta' && 'beta' || 'latest' }}
        run: npm publish "$PACKAGE" --ignore-scripts --tag "$RELEASE_TAG" --access public --provenance --registry https://registry.npmjs.org

      # `npm publish` exits before the registry serves the new version
      # document, so reconciling dist-tags immediately can fail on a write the
      # registry is not ready to accept (observed as a spurious E401 0.69 s
      # after a successful publish). Wait for the exact version to resolve.
      - name: Wait for npm registry visibility
        if: steps.idem.outputs.npm_exists != 'true'
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          TARGET_VER="${VERSION#v}"
          REGISTRY="https://registry.npmjs.org"
          ATTEMPTS=120
          INTERVAL=5
          LAST_RESPONSE=''
          attempt=1
          while [ "$attempt" -le "$ATTEMPTS" ]; do
            if LAST_RESPONSE=$(npm view "pantheon-opencode@${TARGET_VER}" version --json --registry "$REGISTRY" 2>&1); then
              SERVED=$(printf '%s' "$LAST_RESPONSE" | tr -d '"[:space:]')
              if [ "$SERVED" = "$TARGET_VER" ]; then
                echo "npm registry serves pantheon-opencode@${TARGET_VER} (attempt ${attempt}/${ATTEMPTS})."
                exit 0
              fi
            fi
            attempt=$((attempt + 1))
            if [ "$attempt" -le "$ATTEMPTS" ]; then
              sleep "$INTERVAL"
            fi
          done
          echo "::error::pantheon-opencode@${TARGET_VER} was still not resolvable on the npm registry after ${ATTEMPTS} attempts (~$((ATTEMPTS * INTERVAL))s). Last registry response: ${LAST_RESPONSE}"
          exit 1

      - name: Reconcile and assert npm dist-tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_TAG: ${{ inputs.recovery_version != '' && 'beta' || inputs.release_channel == 'beta' && 'beta' || 'latest' }}
        run: |
          set -euo pipefail
          TARGET_VER="${VERSION#v}"
          REGISTRY="https://registry.npmjs.org"
          read_dist_tags() {
            npm view pantheon-opencode dist-tags --json --registry "$REGISTRY"
          }
          # Classify one registry failure as "<class> <detail>":
          #   auth        — deterministic credential/authorization failure
          #   propagation — the version is not indexed yet (E404 only)
          #   transient   — 5xx, network timeout, reset
          #   fatal       — anything unrecognised
          #
          # A dist-tag write right after a publish CAN race propagation, and
          # the registry CAN 5xx or time out; those are worth a bounded retry.
          # An authentication failure is not: retrying E401 five times only
          # repeats the same rejection ~20 s later (run 46120900422), so it
          # fails immediately with its cause and its remedy.
          failure_class() {
            case "$1" in
              *E401*|*ENEEDAUTH*)
                printf '%s %s' auth 'the registry rejected NPM_TOKEN (E401/ENEEDAUTH): it is missing, expired or revoked. Rotate the NPM_TOKEN repository secret with a fresh automation token, then re-run' ;;
              *EOTP*|*'one-time password'*|*'one-time pass'*)
                printf '%s %s' auth 'the token demands a one-time password (EOTP), which cannot be answered unattended. Replace NPM_TOKEN with an automation token that has 2FA bypass enabled' ;;
              *E403*)
                printf '%s %s' auth 'NPM_TOKEN is not allowed to write this package (E403). Grant the token read-write publish access to pantheon-opencode, or use an automation token with publish rights' ;;
              *E404*)
                printf '%s %s' propagation 'the version is not yet present on the registry' ;;
              *ETIMEDOUT*|*ESOCKETTIMEDOUT*|*ECONNRESET*|*EAI_AGAIN*|*ENOTFOUND*|*EPIPE*|*'socket hang up'*|*'network timeout'*)
                printf '%s %s' transient 'the registry connection timed out or reset' ;;
              *E5[0-9][0-9]*|*'status 5'*|*' 5'[0-9][0-9]*)
                printf '%s %s' transient 'the registry reported a 5xx error' ;;
              *)
                printf '%s %s' fatal 'unclassified registry error' ;;
            esac
          }
          version_present() {
            npm view "pantheon-opencode@${TARGET_VER}" version --json --registry "$REGISTRY" >/dev/null 2>&1
          }
          dist_tag_write() {
            local attempt=1
            local output=''
            local verdict=''
            local class=''
            local detail=''
            local retry='no'
            while [ "$attempt" -le 5 ]; do
              if output=$("$@" 2>&1); then
                return 0
              fi
              verdict=$(failure_class "$output")
              class=${verdict%% *}
              detail=${verdict#* }
              retry='no'
              case "$class" in
                transient) retry='yes' ;;
                propagation)
                  # Retry a 404 only when the version really is on the registry:
                  # otherwise this is a missing version, not a propagation race.
                  if version_present; then retry='yes'; fi ;;
              esac
              if [ "$retry" = 'yes' ] && [ "$attempt" -lt 5 ]; then
                echo "npm $* hit a transient registry error (${detail}; attempt ${attempt}/5); retrying in 5s." >&2
                echo "registry said: ${output}" >&2
                sleep 5
                attempt=$((attempt + 1))
                continue
              fi
              if [ "$class" = 'auth' ]; then
                echo "::error::npm $* failed with an authentication error and was not retried — ${detail}" >&2
              elif [ "$class" = 'propagation' ]; then
                echo "::error::npm $* failed after ${attempt} attempt(s) — ${detail}. The version resolves, but the tag write is still refused; check the package's publish permissions and re-run." >&2
              else
                echo "::error::npm $* failed after ${attempt} attempt(s) — ${detail}" >&2
              fi
              echo "registry said: ${output}" >&2
              echo "::error::dist-tags read immediately after the failure: $(read_dist_tags 2>&1 || true)" >&2
              return 1
            done
            return 1
          }
          BEFORE_JSON=$(read_dist_tags)
          # Tags that must end the step pointing at TARGET_VER, in write order.
          ACTIONS=$(BEFORE_JSON="$BEFORE_JSON" TARGET_VER="$TARGET_VER" RELEASE_TAG="$RELEASE_TAG" node <<'NODE'
          const tags = JSON.parse(process.env.BEFORE_JSON || '{}');
          const target = String(process.env.TARGET_VER || '').trim();
          const releaseTag = String(process.env.RELEASE_TAG || 'latest').trim();
          const cmds = [];
          if (releaseTag === 'latest') {
            // `next` is ADVANCED, never removed: DELETE .../dist-tags/next
            // answers 403 for this credential class (2FA-bypass GAT
            // restriction, 2026-07-31) while PUT succeeds. `beta` is advanced
            // for the same reason it always was — a stale beta must not keep
            // resolving to an older version after a newer one ships.
            if (tags.latest !== target) cmds.push('latest');
            if (tags.beta !== target) cmds.push('beta');
            if (tags.next !== target) cmds.push('next');
          } else if (releaseTag === 'beta' && tags.beta !== target) {
            cmds.push('beta');
          }
          process.stdout.write(cmds.join('\n'));
          NODE
          )
          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            dist_tag_write npm dist-tag add "pantheon-opencode@${TARGET_VER}" "$TAG" --registry "$REGISTRY"
          done <<< "$ACTIONS"
          AFTER_JSON=$(read_dist_tags)
          AFTER_JSON="$AFTER_JSON" TARGET_VER="$TARGET_VER" RELEASE_TAG="$RELEASE_TAG" node <<'NODE'
          const tags = JSON.parse(process.env.AFTER_JSON || '{}');
          const target = String(process.env.TARGET_VER || '').trim();
          const releaseTag = String(process.env.RELEASE_TAG || 'latest').trim();
          // Exact equality, not an ordering guess. `dist-tag add` returns early
          // ("is already set") before the PUT when the tag already holds the
          // target, so a tag that merely compares newer can still be wrong —
          // and an unparseable tag always compared "not older".
          if (releaseTag === 'latest') {
            if (tags.latest !== target) {
              console.error(`::error::Expected dist-tags.latest=${target}, got ${tags.latest}. Actual dist-tags read: ${JSON.stringify(tags)}`);
              process.exit(1);
            }
            if (tags.beta !== target) {
              console.error(`::error::Expected dist-tags.beta=${target}, got ${tags.beta}. Actual dist-tags read: ${JSON.stringify(tags)}`);
              process.exit(1);
            }
            if (tags.next !== target) {
              console.error(`::error::Expected dist-tags.next=${target}, got ${tags.next}. Actual dist-tags read: ${JSON.stringify(tags)}`);
              process.exit(1);
            }
          } else if (releaseTag === 'beta' && tags.beta !== target) {
            console.error(`::error::Expected dist-tags.beta=${target}, got ${tags.beta}. Actual dist-tags read: ${JSON.stringify(tags)}`);
            process.exit(1);
          }
          console.log('Verified npm dist-tags:', JSON.stringify(tags));
          NODE
