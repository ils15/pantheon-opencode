name: Auto-Merge Owner PRs

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Enable squash auto-merge
        env:
          PR_MERGE_TOKEN: ${{ secrets.PR_MERGE_TOKEN }}
          GH_TOKEN: ${{ secrets.PR_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "${PR_MERGE_TOKEN}" ]; then
            echo "::warning::PR_MERGE_TOKEN is not set. Merging with GITHUB_TOKEN does not trigger push workflows, so main will have no CI evidence for the merge SHA. See docs/RELEASING.md."
          fi
          gh pr merge --auto --squash "$PR_URL"
