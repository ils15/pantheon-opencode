name: "CodeQL Advanced"

on:
  pull_request:
    branches: [ "main", "develop" ]
  # Main needs its own scan evidence: a PR-only trigger means the merged SHA on
  # main is never scanned, and `Analyze (…)` never reports on main's head — the
  # protection audit depends on this push run.
  push:
    branches: [ "main" ]
  schedule:
    - cron: '28 17 * * 4'
  workflow_dispatch:

concurrency:
  # `schedule` and `workflow_dispatch` resolve github.ref to refs/heads/main —
  # the same group as the push run. Without event_name, a cron/dispatch start
  # could cancel the in-flight push analysis for main's head, leaving a
  # CANCELLED required `Analyze (…)` check. Key on the event; pushes still
  # cancel previous pushes through cancel-in-progress.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: javascript-typescript
          build-mode: none
        - language: python
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Initialize CodeQL
      uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        config-file: .github/codeql/codeql-config.yml

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
      with:
        category: "/language:${{matrix.language}}"
