name: CI

on:
  pull_request:
    branches: [main, develop]
  # The SHA that can reach a release is the SHA on `main`. A release dispatch
  # validates the checked-out commit; without a push run on `main`, a merge
  # commit could be released with CI evidence that only ever existed on the PR
  # head (which GitHub does not necessarily re-run after the merge).
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the release-notes draft runs `git log lastTag..HEAD`,
          # which a shallow depth-1 clone (default) cannot satisfy — it only
          # brings the merge commit and would emit an empty draft.
          fetch-depth: 0

      # Fail the PR if any workflow is malformed. A `${{ runner.temp }}` at
      # job-env scope once made a workflow unparseable (HTTP 422 on push, every
      # run a startup failure) because the `runner` context is only available
      # inside steps. actionlint validates YAML, expressions and context
      # availability, so that class of native parse/context error can no longer
      # be merged. The binary is pinned by version + SHA256; no third-party
      # action needs to be trusted for this gate.
      - name: Validate GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail-with-body --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o "$tarball"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$tarball" | sha256sum --check --strict
          tar --extract --gzip --file "$tarball" --directory "$RUNNER_TEMP" actionlint
          # shellcheck is disabled on purpose: pre-existing style findings in
          # sensitive workflows (release.yml/security-scan.yml) must not block
          # the gate, which covers native parse/context/expression errors.
          # Re-enable after those findings are cleaned up.
          "$RUNNER_TEMP/actionlint" -color -shellcheck=

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            src/mcp/requirements-mcp.txt
            src/mcp/requirements-vision.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.4.0'
          cache: npm
          # src/plugins/tui/package-lock.json is NOT an install input for this
          # job any more — the install below is root-only and resolves the TUI
          # through the `workspaces` entry in the root package-lock.json. It
          # stays listed because that nested lock is still a PUBLISHED,
          # load-bearing artifact: sync-tui.mjs copies it into the user's plugin
          # dir and runs an install there against it, so a change to it must
          # invalidate the npm cache. Dropping this line would hide TUI lock
          # edits from the cache key. tests/tui-workspace-lock.test.mjs is what
          # keeps that lock in sync with the TUI manifest.
          cache-dependency-path: |
            package-lock.json
            src/plugins/tui/package-lock.json

      - name: Install dependencies
        run: |
          python3 -m pip install --quiet coverage pytest pyyaml yamllint pip-audit
          python3 -m pip install --quiet pytest-asyncio==1.3.0
          # Import-time deps of the MCP servers collected by pytest
          # (mcp_resources / pantheon_vision / code_mode /
          # mcp_persistence need mcp + httpx). memory_mcp needs
          # none of it beyond the stdlib: its search is FTS5, and the vector
          # pipeline (sqlite-vec + fastembed) was removed, so neither is
          # installed here.
          python3 -m pip install --quiet -r src/mcp/requirements-mcp.txt
          python3 -m pip install --quiet -r src/mcp/requirements-vision.txt
          npm ci --ignore-scripts

      - name: Validate agent YAML
        run: python3 scripts/ci-validate-yaml.py

      - name: Validate routing.yml
        run: node scripts/validate-routing.mjs

      - name: Doctor checkout runtime
        env:
          # CI deliberately has no repository .venv. Doctor's checkout/lite
          # contract validates the locked dependencies in the prepared Python
          # interpreter instead of skipping the runtime layer.
          PANTHEON_PYTHON: python3
        run: npm run doctor

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Assert rolldown override resolved to the pinned version
        run: |
          # `overrides` BYPASSES range validation instead of erroring, so a
          # future tsdown bump that requires a newer Rolldown would silently
          # receive the pinned version from package.json overrides. The dist-freshness gate
          # would then fail with a ~35-line constant-folding diff in the bundle
          # (`1800*1e3` -> `18e5`) that reads like a port regression. One line
          # of diagnosis here is cheaper than 35 lines of symptom.
          # This reads the INSTALLED tree, so it also proves the override
          # actually applied rather than merely being declared.
          node -e "
            const want='1.2.7';
            const got=require('./node_modules/rolldown/package.json').version;
            if(got!==want){
              console.error('rolldown resolved to '+got+', expected '+want);
              console.error('package.json overrides.rolldown and the bundler output must be bumped together;');
              console.error('check whether the new rolldown constant-folds differently before accepting a dist diff.');
              process.exit(1);
            }
            console.log('rolldown '+got+' as pinned');
          "

      - name: TUI dist freshness (rebuild must be a no-op)
        run: |
          npm run build --prefix src/plugins/tui
          # Normalize final newlines to match the pre-commit end-of-file-fixer
          # convention, then fail if the committed dist differs from a fresh
          # build (guards against shipping a stale TUI bundle).
          node -e "const f=require('fs'),d='src/plugins/tui/dist/';for(const n of f.readdirSync(d)){const p=d+n,s=f.readFileSync(p);if(s.length&&s.at(-1)!==10)f.appendFileSync(p,'\n')}"
          git diff --exit-code src/plugins/tui/dist

      # The V2 hook canary is already run by test:node's
      # `tests/pantheon/*.mjs` glob. Keep `npm run test:hooks` as the focused
      # local command; do not execute the same canary twice in CI.

      # V2 tool canary (tests/canary/plugin-v2-tool-canary.test.mjs). It is the
      # only gate that drives a Pantheon tool through a REAL host — the hook
      # canary above only exercises the built-in `read` tool, which is how
      # `draft.add({ name, description, input, execute })` without `output`
      # shipped for 26 days with every test green.
      #
      # It is deliberately NOT matched by test:node's `tests/pantheon/*.mjs`
      # glob, which runs every file concurrently: the hook canary failed 15/15
      # under 24 workers from CPU starvation. So it runs here, as its own
      # serial step, and the file stays where it is. Do not raise concurrency
      # or fold this into `test:node` to "save a step".
      #
      # Two steps, because the file holds two different claims:
      #   1. two cases that need no host at all — they run unconditionally;
      #   2. the host-backed cases, which need an `opencode` binary and are
      #      unavailable on this runner. That unavailability is announced in the
      #      log on purpose: "no binary" and "never tested" must not look the
      #      same in the run summary.
      - name: V2 tool canary (host-free guards)
        env:
          # The host-free cases are host-free by construction, so this step
          # claims exactly the two it runs. Pointing BINARY at a path that does
          # not exist stops the file's `before` hook from starting a real host
          # even on a machine that has one — otherwise a broken host would fail
          # a step whose guarantee does not depend on the host.
          PANTHEON_TOOL_CANARY_BIN: /nonexistent/opencode
        run: >-
          node --test
          --test-name-pattern='the host environment is redirected into the sandbox|the mutation really removes output from draft.add'
          tests/canary/plugin-v2-tool-canary.test.mjs

      - name: V2 tool canary (full host run)
        run: |
          set -euo pipefail
          if ! command -v "${PANTHEON_TOOL_CANARY_BIN:-opencode}" >/dev/null 2>&1; then
            echo "GATE tool-canary: SKIP (not PASS) — no host binary on PATH; this is a labelled skip, never release evidence."
            {
              echo '### Tool canary: SKIPPED (not PASS)'
              echo 'No `opencode` binary on PATH. The host-backed canary did **not** run.'
              echo 'This job is a development-loop signal, not release evidence; the release workflow runs its own fail-closed host gate.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Tool canary SKIPPED (not PASS)::no 'opencode' binary on PATH — the host-backed tool canary did NOT run here."
            if [ "${PANTHEON_RELEASE_CONTEXT:-0}" = "1" ]; then
              echo "::error::Release context requires a real host; a skipped canary is not a PASS."
              exit 1
            fi
            exit 0
          fi
          npm run test:tool-canary

      - name: Security audit
        run: |
          npm run audit
          python3 -m pip_audit -r src/mcp/requirements-mcp.txt
          python3 -m pip_audit -r src/mcp/requirements-vision.txt

      - name: Scan versionable files for credentials
        run: npm run test:security

      # Folded in from the former standalone `version-check` job: it re-ran the
      # identical checkout + `npm ci --ignore-scripts` that this job already
      # performs, so a second runner added no coverage — only wall-clock.
      - name: Verify version manifests are in sync
        run: npm run version:check

      - name: Verify supported Node engine policy
        run: npm run engine:check

      - name: Validate publishable package
        run: npm run package:validate

      - name: Verify tarball/package evidence
        run: npm run package:evidence -- --output-dir="$RUNNER_TEMP/package-evidence" --target-sha="$(git rev-parse HEAD)"

      - name: V2 sandbox (isolated database and dedicated port)
        env:
          PANTHEON_SANDBOX_ROOT: ${{ runner.temp }}/pantheon-sandbox-v2
          OPENCODE_DB: ${{ runner.temp }}/pantheon-sandbox-v2/opencode-v2.db
          PANTHEON_V2_PORT: '49376'
          PORT: '49376'
        run: |
          set -euo pipefail
          mkdir -p "$PANTHEON_SANDBOX_ROOT"
          bash scripts/test-opencode-v2-sandbox.sh --prepare --run v2

  test-suite:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Node tests need stable tags and the T1 benchmark needs older
          # snapshots; a shallow checkout omits both.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            src/mcp/requirements-mcp.txt
            src/mcp/requirements-vision.txt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.4.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/plugins/tui/package-lock.json

      - name: Install test dependencies (isolated venv for the pinned Python stack)
        # Same contract as release gate (a): pytest imports fastmcp/mcp at
        # collection time, so it must run against the exact pins in
        # src/mcp/requirements-mcp.txt. A venv keeps ambient site-packages out
        # of the result; its bin is prepended to GITHUB_PATH, so every later
        # `python3` in this job is the pinned interpreter, and PANTHEON_PYTHON
        # names it explicitly for scripts that honour the variable
        # (scripts/doctor.mjs). Fail-closed: a broken install or an
        # unsatisfied pin aborts here instead of turning the suite into an
        # environment-only collection error.
        run: |
          set -euo pipefail
          GATE_VENV="$RUNNER_TEMP/ci-venv"
          rm -rf "$GATE_VENV"
          python3 -m venv "$GATE_VENV"
          "$GATE_VENV/bin/python" -m pip install --quiet --upgrade pip
          "$GATE_VENV/bin/python" -m pip install --quiet coverage pytest pyyaml
          "$GATE_VENV/bin/python" -m pip install --quiet pytest-asyncio==1.3.0
          "$GATE_VENV/bin/python" -m pip install --quiet -r src/mcp/requirements-mcp.txt -r src/mcp/requirements-vision.txt
          "$GATE_VENV/bin/python" -m pip check
          "$GATE_VENV/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import pathlib
          import sys

          mismatches = []
          for requirements in ('src/mcp/requirements-mcp.txt', 'src/mcp/requirements-vision.txt'):
              for raw in pathlib.Path(requirements).read_text(encoding='utf-8').splitlines():
                  line = raw.split('#', 1)[0].strip()
                  if not line:
                      continue
                  name, _, pin = line.partition('==')
                  if not pin:
                      mismatches.append(f'{name}: not an exact pin')
                      continue
                  try:
                      installed = metadata.version(name)
                  except metadata.PackageNotFoundError:
                      mismatches.append(f'{name}: not installed')
                      continue
                  if installed != pin:
                      mismatches.append(f'{name}=={installed} (expected {pin})')
          if mismatches:
              sys.exit('pinned requirements are not satisfied: ' + '; '.join(mismatches))
          PY
          echo "$GATE_VENV/bin" >> "$GITHUB_PATH"
          echo "PANTHEON_PYTHON=$GATE_VENV/bin/python" >> "$GITHUB_ENV"
          "$GATE_VENV/bin/python" --version
          npm ci --ignore-scripts

      # Keep the full test suite off the packaging, audit, and live-sandbox
      # validation critical path. Coverage runs pytest once, replacing the old
      # separate pytest pass that followed `npm test`.
      - name: Python tests and coverage (>=80%)
        run: |
          python3 -m coverage run --branch --source=src/mcp -m pytest -q --tb=short
          python3 -m coverage report --fail-under=80

      - name: Node tests
        run: npm run test:node

      - name: TypeScript tests
        run: npm run test:ts

  plugin-v2-ts-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.4.0'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript plugin coverage
        run: npm run coverage:plugin-v2

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.4.0'
      # The docs checks use only Node's standard library; no dependency
      # install and no mkdocs virtualenv are needed.
      - name: Docs link check
        run: npm run docs:lint
      - name: Changelog structure
        run: npm run docs:check-changelog
