name: CI

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the release-notes draft runs `git log lastTag..HEAD`,
          # which a shallow depth-1 clone (default) cannot satisfy — it only
          # brings the merge commit and would emit an empty draft.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Install dependencies
        run: |
          python3 -m pip install --quiet pytest pyyaml yamllint pip-audit
          python3 -m pip install --quiet pytest-asyncio==1.3.0
          python3 -m pip install --quiet -r src/mcp/requirements-mcp.txt
          python3 -m pip install --quiet -r src/mcp/requirements-vision.txt
          npm ci --ignore-scripts
          npm ci --prefix src/plugins/tui --ignore-scripts

      - name: Validate agent YAML
        run: python3 scripts/ci-validate-yaml.py

      - name: Validate routing.yml
        run: node scripts/validate-routing.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run TypeScript tests
        run: npm run test:ts

      - name: Run Python tests
        run: npm run test:ci

      - name: Run Node tests (PR #31 wiring — prune, hooks, install contracts)
        run: npm run test:node

      - name: Security audit
        run: |
          npm run audit
          python3 -m pip_audit -r src/mcp/requirements-mcp.txt
          python3 -m pip_audit -r src/mcp/requirements-vision.txt
          python3 -m pip_audit -r scripts/vector_memory/requirements.txt

      - name: Scan versionable files for credentials
        run: npm run test:security

      - name: Verify package
        run: npm run package:evidence -- --output-dir="$RUNNER_TEMP/package-evidence" --target-sha="$(git rev-parse HEAD)"

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify version manifests are in sync
        run: npm run version:check
