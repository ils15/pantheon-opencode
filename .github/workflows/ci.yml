name: CI

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install dependencies
        run: pip install --quiet pytest pyyaml yamllint 2>&1 && npm ci --ignore-scripts 2>&1 || npm install 2>&1

      - name: Validate agent YAML
        run: python3 scripts/ci-validate-yaml.py

      - name: Validate routing.yml
        run: node scripts/validate-routing.mjs

      - name: Run tests
        run: python3 -m pytest tests/ -q --tb=short 2>&1 || echo "test warnings"

      - name: Security audit
        run: npm audit --audit-level=high 2>&1 || echo "audit warnings"

      - name: Verify package
        run: npm pack --dry-run 2>&1 | tail -3
