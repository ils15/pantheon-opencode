name: Hotfix

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  backmerge:
    if: github.event.pull_request.merged && startsWith(github.head_ref, 'hotfix/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Backmerge to develop
        run: |
          git config user.name "pantheon-bot"
          git config user.email "bot@pantheon.dev"
          git fetch origin develop
          git checkout develop
          git merge --ff-only origin/main || {
            echo "⚠️ Fast-forward merge failed, creating merge commit"
            git merge origin/main -m "chore: backmerge hotfix from main [skip ci]"
          }
          git push origin develop
