name: Docs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version alias to deploy (e.g., v1.4.3)'
        required: true

permissions:
  # `mike` only pushes the versioned docs to the `gh-pages` branch. It does not
  # call the Pages deployment API, so `pages: write` and `id-token: write`
  # (OIDC) are not required and have been removed to keep the token minimal.
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r docs/requirements.txt

      - name: Configure Git
        run: |
          git config user.name "pantheon-bot"
          git config user.email "bot@pantheon.ai"

      - name: Deploy versioned docs
        if: github.event_name == 'push'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mike deploy --update-aliases "${VERSION}" latest
          mike set-default latest

      - name: Deploy docs (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          mike deploy --update-aliases "${{ github.event.inputs.version }}" latest
          mike set-default latest
