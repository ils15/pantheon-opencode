name: Platform Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate OpenCode platform config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci --ignore-scripts || npm install

      - name: Validate routing.yml
        run: node scripts/validate-routing.mjs

      - name: Validate agent frontmatter
        run: |
          set -e; FAILED=0
          for file in src/agents/*.md; do
            [ -f "$file" ] || continue
            fm=$(awk '/^---/{if(f){exit}else{f=1;next}} f{print}' "$file")
            [ -z "$fm" ] && { echo "No frontmatter $file"; FAILED=1; continue; }
            echo "$fm" | python3 -c "import yaml,sys; yaml.safe_load(sys.stdin)" && echo "OK $(basename $file)" || { echo "FAIL $file"; FAILED=1; }
          done
          [ "$FAILED" -eq 0 ] || exit 1