name: Commit Lint

on:
  push:
    branches: [main]
  pull_request:
    # `edited` is required: a retitled PR must be re-linted, because the PR
    # title becomes the squash commit subject on main. Without it, a bad title
    # could be introduced after the last `synchronize`.
    types: [opened, synchronize, reopened, edited]
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.4.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint PR title
        # PR titles are never commits, so no other job ever sees them. A
        # squash merge turns the title into the subject that lands on main —
        # the only artifact nobody validated. Lint it with the same commitlint
        # config as a commit message.
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/commitlint"
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/commitlint/pr-title.txt"
          npx --no -- commitlint --edit "$RUNNER_TEMP/commitlint/pr-title.txt" --verbose

      - name: Validate commits
        # Nothing new to lint when only the title/body changed; the PR-title
        # step above covers `edited`.
        if: github.event_name != 'pull_request' || github.event.action != 'edited'
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR path: lint every commit between base and head
            npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
            exit $?
          fi

          # Push path: lint the pushed range on main.
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          ZERO="0000000000000000000000000000000000000000"

          # Initial push (all-zero before) or invalid/empty range → fall back
          # to the last commit.
          if [ "$BEFORE" = "$ZERO" ] || ! git rev-list "$BEFORE..$AFTER" >/dev/null 2>&1; then
            if ! git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              echo "Single-commit repository — nothing to lint."
              exit 0
            fi
            RANGE="HEAD~1..HEAD"
          else
            RANGE="$BEFORE..$AFTER"
          fi

          # Lint each commit in the range. Merge / release-tag / semver commits
          # are auto-ignored by commitlint defaults; github-actions[bot]
          # commits (release pipeline) are exempt per risk mitigation.
          FAILED=0
          for sha in $(git rev-list "$RANGE"); do
            AUTHOR=$(git log -1 --format='%an' "$sha")
            if [ "$AUTHOR" = "github-actions[bot]" ]; then
              echo "Skipping bot commit: ${sha:0:7}"
              continue
            fi
            if ! git log -1 --format='%s' "$sha" | npx --no -- commitlint --verbose; then
              FAILED=1
            fi
          done
          exit $FAILED
