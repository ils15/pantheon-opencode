name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Auto Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest 2>&1 | tail -3

      - name: Run quality gates
        run: |
          echo "Running quality gates..."
          npm test 2>&1 || { echo "❌ Tests failed"; exit 1; }
          npx biome ci . 2>&1 || echo "⚠️ Biome warnings (non-blocking)"
          npx tsc --noEmit 2>&1 || echo "⚠️ TypeScript warnings (non-blocking)"
          npm audit --audit-level=high 2>&1 || echo "⚠️ Audit warnings (non-blocking)"

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Release v${VERSION}"

      - name: Check if version changed
        id: version_check
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          NPM_VER=$(npm view pantheon-opencode version 2>/dev/null || echo "none")
          if git rev-parse "$TAG" >/dev/null 2>&1 && [ "v$NPM_VER" = "$TAG" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG exists AND npm already has v$NPM_VER — skipping"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG or npm version differs — proceeding"
          fi

      - name: Generate release notes
        if: steps.version_check.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if command -v git-cliff &>/dev/null; then
            git-cliff --tag "$VERSION" --strip header --output release_notes.md
          else
            awk -v ver="$VERSION" '
              /^## \['"$VERSION"'\]/ { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > release_notes.md
          fi
          if [ ! -s release_notes.md ]; then
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." > release_notes.md
          fi

      - name: Build package
        if: steps.version_check.outputs.changed == 'true'
        run: npm pack || { echo "❌ npm pack failed"; exit 1; }

      - name: Generate checksums
        if: steps.version_check.outputs.changed == 'true'
        run: sha256sum pantheon-*.tgz > pantheon-$(node -p "require('./package.json').version").tgz.sha256

      - name: Publish to npm
        if: steps.version_check.outputs.changed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --access public --provenance 2>&1 || { echo "❌ npm publish failed"; exit 1; }
          else
            echo "⚠️ NPM_TOKEN not configured — publish manually: npm publish --access public"
          fi

      - name: Create GitHub Release
        if: steps.version_check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "$VERSION" \
            --title "Pantheon ${VERSION}" \
            --notes-file release_notes.md \
            pantheon-*.tgz pantheon-*.tgz.sha256
          echo "✅ Published Pantheon ${VERSION}"
