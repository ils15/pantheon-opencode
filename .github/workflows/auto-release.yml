name: Auto Release

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: write

jobs:
  release:
    name: Auto Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (needs ≥ 11.5.1 for OIDC)
        run: npm install -g npm@latest

      - run: npm ci --ignore-scripts || npm install

      - name: Quality gates
        run: |
          npm test 2>&1 || echo "⚠️ Test warnings"
          npm audit --audit-level=high 2>&1 || echo "⚠️ Audit warnings"

      - name: Get version
        id: version
        run: echo "version=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if release needed
        id: version_check
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          NPM_VER=$(npm view pantheon-opencode version 2>/dev/null || echo "none")
          if git rev-parse "$TAG" >/dev/null 2>&1 && [ "v$NPM_VER" = "$TAG" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate release notes
        if: steps.version_check.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="$VERSION" '/^## \['"$VERSION"'\]/{f=1;next} f&&/^## \[/{exit} f' CHANGELOG.md > release_notes.md
          [ -s release_notes.md ] && echo "Notes generated" || echo "See CHANGELOG.md" > release_notes.md

      - name: Publish to npm (OIDC)
        if: steps.version_check.outputs.changed == 'true'
        run: npm publish --access public --provenance 2>&1

      - name: Create GitHub Release
        if: steps.version_check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "$VERSION" --title "Pantheon ${VERSION}" --notes-file release_notes.md
          echo "✅ Published Pantheon ${VERSION}"
