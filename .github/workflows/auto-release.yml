name: Auto Release

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'package.json'

permissions:
  id-token: write
  contents: write

jobs:
  release:
    name: Auto Release
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: auto-release-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: npm install -g npm@latest

      - run: npm ci --ignore-scripts || npm install

      - name: Quality gates
        run: |
          npm test 2>&1 || echo "Test warnings"
          npm audit --audit-level=high 2>&1 || echo "Audit warnings"

      - name: Detect release type
        id: type
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          fi

      # ── STABLE RELEASE (main) ──────────────────────────────────
      - name: Check if stable release needed
        id: version_check
        if: steps.type.outputs.channel == 'stable'
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          NPM_VER=$(npm view pantheon-opencode version 2>/dev/null || echo "none")
          if git rev-parse "$TAG" >/dev/null 2>&1 && [ "v$NPM_VER" = "$TAG" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate stable release notes
        if: steps.type.outputs.channel == 'stable' && steps.version_check.outputs.changed == 'true'
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          awk -v ver="$VERSION" '/^## \['"$VERSION"'\]/{f=1;next} f&&/^## \[/{exit} f' CHANGELOG.md > release_notes.md
          [ -s release_notes.md ] && echo "Notes generated" || echo "See CHANGELOG.md" > release_notes.md

      # ── BETA RELEASE (develop) ─────────────────────────────────
      - name: Bump beta version
        id: bump
        if: steps.type.outputs.channel == 'beta'
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          npm version prerelease --preid beta --no-git-tag-version
          NEXT=$(node -p "require('./package.json').version")
          echo "from=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "to=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Generate beta release notes
        if: steps.type.outputs.channel == 'beta'
        run: |
          cat > /tmp/beta-notes.md <<- EOF
          Beta release from develop.
          Install with: npm install pantheon-opencode@beta

          Changes since ${{ steps.bump.outputs.from }}:
          $(git log "${{ steps.bump.outputs.from }}..HEAD" --oneline --no-decorate 2>/dev/null || echo "See commit history")
          EOF

      # ── PUBLISH (both) ─────────────────────────────────────────
      - name: Publish stable to npm
        if: steps.type.outputs.channel == 'stable' && steps.version_check.outputs.changed == 'true'
        run: npm publish --access public --provenance 2>&1

      - name: Check if beta version exists on npm
        id: npm_check
        if: steps.type.outputs.channel == 'beta'
        run: |
          NPM_VER=$(npm view pantheon-opencode version --tag beta 2>/dev/null || echo "none")
          LOCAL_VER="${{ steps.bump.outputs.to }}"
          if [ "$NPM_VER" = "$LOCAL_VER" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Version $LOCAL_VER already published — skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish beta to npm
        if: steps.type.outputs.channel == 'beta' && steps.npm_check.outputs.exists == 'false'
        run: npm publish --tag beta --access public --provenance 2>&1

      # ── COMMIT BACK (beta only) ────────────────────────────────
      - name: Commit beta version bump
        if: steps.type.outputs.channel == 'beta' && steps.npm_check.outputs.exists == 'false'
        run: |
          git config user.name "pantheon-bot"
          git config user.email "bot@pantheon.dev"
          git add package.json
          git add pyproject.toml plugin.json .github/plugin/plugin.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit — version already current"
          else
            git commit -m "chore(release): v${{ steps.bump.outputs.to }}"
            git push
          fi

      # ── GITHUB RELEASE (both) ──────────────────────────────────
      - name: Create GitHub Release (stable)
        if: steps.type.outputs.channel == 'stable' && steps.version_check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          gh release create "$VERSION" \
            --title "Pantheon ${VERSION}" \
            --notes-file release_notes.md
          echo "Published Pantheon ${VERSION}"

      - name: Create GitHub Pre-release (beta)
        if: steps.type.outputs.channel == 'beta' && steps.npm_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ steps.bump.outputs.to }}"
          gh release create "$VERSION" \
            --title "Pantheon ${VERSION} (beta)" \
            --prerelease \
            --notes-file /tmp/beta-notes.md
          echo "Published beta $VERSION"
