name: Release Gate

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci --ignore-scripts || npm install

      - name: Run tests
        run: npm test || { echo "❌ Tests failed"; exit 1; }

      - name: Run linter
        run: npx biome ci . 2>&1 || echo "⚠️ Biome warnings (non-blocking)"

      - name: TypeScript typecheck
        run: npx tsc --noEmit 2>&1 || echo "⚠️ TypeScript warnings (non-blocking)"

      - name: Security audit
        run: npm audit --audit-level=high 2>&1 || echo "⚠️ Audit warnings (non-blocking)"

      - name: Build package dry-run
        run: npm pack --dry-run 2>&1 || echo "⚠️ npm pack dry-run warnings"

      - name: Check version consistency
        run: node scripts/versioning.mjs status 2>&1 || echo "⚠️ Version check warnings (non-blocking)"

      - name: Check npm token configured
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "✅ NPM_TOKEN configured for automated publish"
          else
            echo "⚠️ No NPM_TOKEN — publish manually: npm publish --access public"
          fi
