name: Release Beta

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to build beta from'
        required: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  beta:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'release:beta' && github.event.action == 'labeled')
    runs-on: ubuntu-latest
    concurrency:
      group: beta-${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' &&
                    format('refs/pull/{0}/head', inputs.pr_number) ||
                    github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci --ignore-scripts 2>/dev/null || npm install

      - name: Compute beta version
        id: betaver
        run: |
          PR=${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.number }}
          SHA=$(git rev-parse --short HEAD)
          BASE=$(node -p "require('./package.json').version")
          echo "version=${BASE}-beta.${PR}.${SHA}" >> "$GITHUB_OUTPUT"

      - name: Bump to beta version
        run: |
          npm version ${{ steps.betaver.outputs.version }} --no-git-tag-version
          echo "Version: $(node -p "require('./package.json').version")"

      - name: Pack and verify
        run: npm pack --dry-run 2>&1 | tail -3

      - name: Publish beta to npm
        run: npm publish --tag beta --access public --provenance 2>&1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.betaver.outputs.version }}"
          PR=${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.number }}
          gh release create "v${VERSION}" \
            --title "Pantheon v${VERSION} (PR #${PR})" \
            --prerelease \
            --notes "Beta release from PR #${PR}. SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.head.sha }}"

      - name: Post comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const ver = '${{ steps.betaver.outputs.version }}';
            const pr = ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.number }};
            github.rest.issues.createComment({
              ...context.repo,
              issue_number: pr,
              body: `📦 Beta \`${ver}\` published.\n\n\`\`\`\nnpm install pantheon-opencode@${ver}\nnpm install pantheon-opencode@beta\n\`\`\``
            });
