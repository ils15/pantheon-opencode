# Pantheon OpenCode — pre-commit hooks (fail-closed local secret gate)
#
# Local enforcement layer, one step BEFORE the CI gate
# (.github/workflows/security-scan.yml -> gitleaks + scripts/secret-scan.mjs).
#
# Policy: ANY secret finding blocks the commit. There is no exception
# configured here; bypassing hooks with --no-verify is a security violation.
#
# Install (one-time, per machine):
#   python3 -m pip install --user pre-commit   # framework runtime only
#   npm run hooks:install                      # -> scripts/verify-git-hooks.mjs --apply
#
# `pre-commit install` is deliberately NOT used: `core.hooksPath` is set to the
# TRACKED `.husky` directory, and pre-commit 4.x refuses to install while it is
# set ("Cowardly refusing to install hooks with `core.hooksPath` set"). The
# tracked `.husky/pre-commit` IS the integration — it execs `pre_commit run`.
#
# Why tracked and not husky's `.husky/_`: hooksPath lives in the SHARED
# .git/config, so every worktree inherits the pointer, but `git worktree add`
# materialises only tracked files. A generated/untracked hooks dir therefore
# does not exist in a worktree and git skips every hook SILENTLY (v1.0 -> 2.3.4).
# tests/hooks-worktree.test.mjs is the tripwire; the hook fails loudly when a
# fresh worktree has no node_modules — fix with `npm ci` inside that worktree.
#
# Update hooks: npm run hooks:update  # -> pre-commit autoupdate

repos:
  # --- Secret detection: gitleaks (mirrors CI .gitleaks.toml policy) ---
  # Fails with exit code 2 on ANY finding in the staged diff. Values are
  # redacted in output (--redact). --config pins the repo policy.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks — block hardcoded secrets (staged)
        args: [--config=.gitleaks.toml, --redact, --exit-code=2]

  # --- Code quality: whitespace, config syntax, repo hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5120]  # hard cap at 5 MB
      - id: forbid-new-submodules

  # --- Local: generated artifacts must match their sources before commit ---
  # Rebuild + diff (the same semantics as CI), not `build-roster --check`:
  # that check trims both sides, so formatter-level rewrites (trailing newline,
  # quoting) pass locally and fail CI.
  #
  # Tradeoff: rebuilding normalizes the working tree to canonical output.
  # Unstaged/untracked generated files are copied to a temp directory first
  # (path printed) so a hand-edit is never lost; staged drift still fails.
  # Both generators run before the hook exits, so one attempt reports both.
  # The same hook rebuilds and diffs the committed TUI bundle
  # (`src/plugins/tui/dist`), which CI's `validate` job also rejects on drift.
  - repo: local
    hooks:
      - id: generated-artifacts
        name: generated-artifacts — rebuild and diff src/agents + src/plugin + TUI dist
        entry: node scripts/check-generated-hook.mjs
        language: system
        pass_filenames: false

      # `.pantheon/` runtime state has been ignored since v1.0, but a force-add
      # (ecebfbb, 2026-08-05) put a release-audit snapshot into history anyway.
      # History is not rewritten; instead this closes the boundary. The policy is
      # deny-by-default with a small versioned exception list (ADRs + code-mode
      # payload) that a test keeps in parity with the `.gitignore` un-ignore rules;
      # files already tracked in HEAD are grandfathered. It holds with no
      # `.gitignore` at all, and a nested `.pantheon/` is always blocked.
      - id: pantheon-runtime-state
        name: pantheon-runtime-state — reject staged .pantheon/ runtime state
        entry: node scripts/hooks/check-pantheon-runtime-staged.mjs
        language: system
        pass_filenames: true

  # --- Local: custom Bifrost/API credential scan (header + value patterns) ---
  # scripts/secret-scan.mjs scans the full versionable set (index + untracked)
  # and never prints secret values, only file + label.
  - repo: local
    hooks:
      - id: secret-scan
        name: secret-scan — Bifrost/API credentials in versionable files
        entry: node scripts/secret-scan.mjs
        language: system
        pass_filenames: false

default_language_version:
  python: python3
  node: node

default_stages: [pre-commit]
# Restrictive: stop at the first failing hook.
fail_fast: true
