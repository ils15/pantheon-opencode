version: 1.0
agents:
  zeus:
    role: Central orchestrator
    reasoning_effort: medium
    user_invocable: true
    can_delegate: true
    can_receive_delegation: true
    capabilities:
    - orchestration
    - delegation
    - context_conservation
    - context_compression
    - phase_management
    - quality_gate_enforcement
    - memory_recall
    - pantheon_resources
    - pantheon_code_mode
    - pantheon_deepwork
    subagent_can_delegate_to:
    - athena
    - apollo
    - hermes
    - aphrodite
    - demeter
    - themis
    - prometheus
    - hephaestus
    - nyx
    - iris
    - mnemosyne
    - talos
    skills:
    - agent-coordination
    - session-goal
    - artifact-management
    - context-compression
    - auto-continue
    - orchestration-workflow
    - incremental-implementation
  athena:
    role: Strategic planner
    reasoning_effort: high
    user_invocable: true
    can_delegate: true
    can_receive_delegation: true
    capabilities:
    - strategic_planning
    - tdd_planning
    - architectural_design
    - root_cause_analysis
    - risk_assessment
    - memory_recall
    - pantheon_resources
    subagent_can_delegate_to:
    - apollo
    skills:
    - spec-driven-development
    - memory-bank
  apollo:
    role: Investigation scout
    reasoning_effort: low
    user_invocable: false
    can_delegate: false
    can_receive_delegation: true
    capabilities:
    - codebase_discovery
    - pattern_discovery
    - dependency_research
    - parallel_search
    - codemap_generation
    - memory_search
    - pantheon_resources
    subagent_can_delegate_to: []
    skills:
    - auto-continue
  hermes:
    role: Backend specialist
    reasoning_effort: medium
    user_invocable: true
    can_delegate: true
    can_receive_delegation: true
    capabilities:
    - backend_implementation
    - api_development
    - service_layer
    - async_programming
    - obsolete_lib_detection
    - memory_store
    - pantheon_code_mode
    subagent_can_delegate_to:
    - apollo
    - themis
    - mnemosyne
    skills:
    - tdd-with-agents
    - file-prompts
    - streaming-patterns
    - git-workflow-and-versioning
    - incremental-implementation
  aphrodite:
    role: Frontend specialist
    reasoning_effort: medium
    user_invocable: true
    can_delegate: false
    can_receive_delegation: true
    capabilities:
    - frontend_implementation
    - ui_component_design
    - accessibility_audit
    - responsive_design
    - deprecated_npm_detection
    - memory_store
    - pantheon_resources_memory_bank
    - pantheon_code_mode
    skills:
    - tdd-with-agents
    - visual-review-pipeline
    - file-prompts
  demeter:
    role: Database specialist
    reasoning_effort: medium
    user_invocable: true
    can_delegate: false
    can_receive_delegation: true
    capabilities:
    - database_migration
    - schema_design
    - query_optimization
    - n_plus_one_prevention
    - index_strategy
    - memory_store
    - memory_recall
    - pantheon_code_mode
    skills:
    - tdd-with-agents
    - incremental-implementation
  themis:
    role: Quality gate
    reasoning_effort: high
    user_invocable: true
    can_delegate: true
    can_receive_delegation: true
    capabilities:
    - code_review
    - security_audit
    - test_coverage_validation
    - quality_gate
    - dead_code_detection
    - deprecation_audit
    - memory_search
    - pantheon_resources
    - pantheon_code_mode
    subagent_can_delegate_to:
    - mnemosyne
    skills:
    - code-review-checklist
    - security-hardening
    - tdd-with-agents
    - context-compression
  prometheus:
    role: Infrastructure specialist
    reasoning_effort: medium
    user_invocable: true
    can_delegate: false
    can_receive_delegation: true
    capabilities:
    - infrastructure_as_code
    - docker_configuration
    - ci_cd_pipelines
    - deployment_strategy
    - container_optimization
    - pantheon_code_mode
    - memory_store
    skills:
    - git-workflow-and-versioning
    - incremental-implementation
  hephaestus:
    role: AI pipelines
    reasoning_effort: medium
    user_invocable: true
    can_delegate: false
    can_receive_delegation: true
    capabilities:
    - rag_pipeline_design
    - langchain_workflow
    - vector_store_integration
    - embedding_strategy
    - ai_workflow_composition
    - memory_search
    - pantheon_code_mode
    skills:
    - tdd-with-agents
    - auto-continue
  nyx:
    role: Observability
    reasoning_effort: low
    user_invocable: true
    can_delegate: false
    can_receive_delegation: true
    capabilities:
    - opentelemetry_setup
    - token_cost_tracking
    - agent_performance_analytics
    - alerting
    - monitoring_dashboards
    - pantheon_resources_routing
    - pantheon_code_mode
    skills:
    - security-hardening
    - auto-continue
  gaia:
    role: Remote sensing domain specialist
    reasoning_effort: low
    user_invocable: false
    can_delegate: false
    can_receive_delegation: true
    capabilities:
    - remote_sensing
    - spectral_analysis
    - change_detection
    - ml_classification
    skills:
    - auto-continue
  iris:
    role: GitHub operations
    reasoning_effort: low
    user_invocable: true
    can_delegate: false
    can_receive_delegation: true
    capabilities:
    - branch_management
    - pull_request_creation
    - issue_tracking
    - release_management
    - changelog_generation
    - pantheon_resources
    skills:
    - git-workflow-and-versioning
    - artifact-management
  mnemosyne:
    role: Memory bank
    reasoning_effort: low
    user_invocable: true
    can_delegate: false
    can_receive_delegation: true
    capabilities:
    - memory_bank_management
    - artifact_persistence
    - adr_writing
    - project_initialization
    - sprint_documentation
    - context_compression
    - memory_store
    - memory_recall
    - pantheon_resources_memory_bank
    - pantheon_code_mode
    subagent_can_delegate_to: []
    skills:
    - artifact-management
    - memory-bank
    - context-compression
    - session-goal
  talos:
    role: Hotfix agent
    reasoning_effort: low
    user_invocable: true
    can_delegate: false
    can_receive_delegation: true
    capabilities:
    - rapid_repair
    - css_fix
    - typo_correction
    - minor_bug_fix
    - escalation_detection
    - pantheon_code_mode
    subagent_can_delegate_to: []
    skills:
    - incremental-implementation
auto_continue:
  checkpoint_script: .pantheon/code-mode/checkpoint-session.sh
  heartbeat_interval: 5
  idle:
    warning: 60
    stall: 120
    pause: 300
intent_gate:
  fix:
    patterns:
    - bug
    - error
    - crash
    - broken
    - fail
    - wrong
    - incorrect
    target: talos
  research:
    patterns:
    - how
    - what
    - why
    - where
    - find
    - search
    - lookup
    - documentation
    target: apollo
  investigate:
    patterns:
    - compare
    - vs
    - trade.?off
    - should
    - which
    - risk
    - impact
    target: athena
  plan:
    patterns:
    - plan
    - roadmap
    - architecture
    - design
    - proposal
    - strategy
    target: athena
  implement:
    patterns: []
    target: hermes
delegation:
  zeus:
  - target: athena
  - target: apollo
  - target: hermes
  - target: aphrodite
  - target: demeter
  - target: themis
  - target: prometheus
  - target: hephaestus
  - target: nyx
  - target: gaia
  - target: iris
  - target: mnemosyne
  - target: talos
handoffs:
  zeus:
    compress_context:
      label: 🗜️ Compress Context
      description: Compress completed subtask_summaries and archive IMPL/REVIEW artifacts
        after Themis approval
      agent: mnemosyne
      prompt: 'Compress completed phase artifacts (Level 2): create ZZ-phase{N}-context.md
        with priority-scored entries, write compressed entries to 01-active-context.md
        (priority-aware, budget-allocated), archive IMPL/REVIEW to 02-progress-log.md,
        update _xref/index.md cross-references.'

fallback_chains:
  apollo:
    - athena
    - hermes
  hermes:
    - talos
    - athena
  aphrodite:
    - talos
    - hermes
  demeter:
    - hermes
    - athena
  themis:
    - zeus
  prometheus:
    - hermes
    - zeus
  talos:
    - hermes
  hephaestus:
    - nyx
    - hermes
  nyx:
    - hermes
  iris:
    - zeus
  mnemosyne:
    - zeus

platforms:
  opencode:
    display_name: OpenCode
    tools:
      delegate_agent: agent
      delegate_subagent: task
      ask_user: question
      search_codebase: grep
      search_files: glob
      read_file: read
      run_bash: bash
      web_fetch: webfetch
      web_search: websearch
    capabilities:
    - agent_delegation
    - subagent_delegation
    - bash_execution
    - web_fetch
    - web_search
background_job_board:
  max_concurrent_per_agent: 3
  signal_dir: .pantheon/deepwork/board-signals/
  persistence_dir: .pantheon/board/jobs/
