    - sprint_documentation
    - context_compression
    - memory_store
    - memory_recall
    - pantheon_resources_memory_bank
    - pantheon_code_mode
    subagent_can_delegate_to: []
    skills:
    - artifact-management
    - memory-bank
    - context-compression
    - session-goal
  talos:
    role: Hotfix agent
    reasoning_effort: low
    user_invocable: true
    can_delegate: false
    can_receive_delegation: true
    capabilities:
    - rapid_repair
    - css_fix
    - typo_correction
    - minor_bug_fix
    - escalation_detection
    - pantheon_code_mode
    subagent_can_delegate_to: []
    skills:
    - incremental-implementation
auto_continue:
  checkpoint_script: .pantheon/code-mode/checkpoint-session.sh
  heartbeat_interval: 5
  idle:
    warning: 60
    stall: 120
    pause: 300
intent_gate:
  fix:
    patterns:
    - bug
    - error
    - crash
    - broken
    - fail
    - wrong
    - incorrect
    target: talos
  research:
    patterns:
    - how
    - what
    - why
    - where
    - find
    - search
    - lookup
    - documentation
    target: apollo
  investigate:
    patterns:
    - compare
    - vs
    - trade.?off
    - should
    - which
    - risk
    - impact
    target: athena
  plan:
    patterns:
    - plan
    - roadmap
    - architecture
    - design
    - proposal
    - strategy
    target: athena
  implement:
    patterns: []
    target: hermes
delegation:
  zeus:
  - target: athena
  - target: apollo
  - target: hermes
  - target: aphrodite
  - target: demeter
  - target: themis
  - target: prometheus
  - target: hephaestus
  - target: nyx
  - target: gaia
  - target: iris
  - target: mnemosyne
  - target: talos
handoffs:
  zeus:
    compress_context:
      label: 🗜️ Compress Context
      description: Compress completed subtask_summaries and archive IMPL/REVIEW artifacts
        after Themis approval
      agent: mnemosyne
      prompt: 'Compress completed phase artifacts (Level 2): create ZZ-phase{N}-context.md
        with priority-scored entries, write compressed entries to 01-active-context.md
        (priority-aware, budget-allocated), archive IMPL/REVIEW to 02-progress-log.md,
        update _xref/index.md cross-references.'

fallback_chains:
  apollo:
    - athena
    - hermes
  hermes:
    - talos
    - athena
  aphrodite:
    - talos
    - hermes
  demeter:
    - hermes
    - athena
  themis:
    - zeus
  prometheus:
    - hermes
    - zeus
  talos:
    - hermes
  hephaestus:
    - nyx
    - hermes
  nyx:
    - hermes
  iris:
    - zeus
  mnemosyne:
    - zeus

platforms:
  opencode:
    display_name: OpenCode
    tools:
      delegate_agent: agent
      delegate_subagent: task
      ask_user: question
      search_codebase: grep
      search_files: glob
      read_file: read
      run_bash: bash
      web_fetch: webfetch
      web_search: websearch
    capabilities:
    - agent_delegation
    - subagent_delegation
    - bash_execution
    - web_fetch
    - web_search
background_job_board:
  max_concurrent_per_agent: 3
  signal_dir: .pantheon/deepwork/board-signals/
  persistence_dir: .pantheon/board/jobs/
