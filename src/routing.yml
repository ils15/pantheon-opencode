platforms:
  opencode:
    display_name: OpenCode
    tools:
      delegate_agent: agent
      delegate_subagent: task
      ask_user: question
      search_codebase: grep
      search_files: glob
      read_file: read
      run_bash: bash
      web_fetch: webfetch
      web_search: websearch
    capabilities:
    - agent_delegation
    - subagent_delegation
    - bash_execution
    - web_fetch
    - web_search
background_job_board:
  max_concurrent_per_agent: 3
  signal_dir: .pantheon/deepwork/board-signals/
  persistence_path: .pantheon/board/state.json
background_delegation:
  timeout_ms: 900000        # 15 min
  poll_ms: 250
  max_compaction_items: 10
  prune_ttl_ms: 86400000    # 24h
  read_only_agents: [apollo, gaia]
  session_max: 3
  retry_count: 1
# ── R1: Per-error-type retry + provider cooldown (LiteLLM pattern) ──────
# retry_policy: max retries per error class before escalating. Exponential
# backoff (base 1s, doubling, capped 30s) applies between retries. auth
# errors are NEVER retried (0) — a credential problem will not fix itself.
# Enforcement: zeus-delegate-with-retry (manual waves) + RetryPolicyEngine.
retry_policy:
  auth: 0
  rate_limit: 3
  timeout: 2
  other: 1
# cooldown: after `allowed_fails` consecutive failures for a provider, skip
# that provider for `cooldown_time_seconds`. A success resets the counter.
# In-memory tracker (no Redis) — process-wide, shared across retry helpers.
cooldown:
  allowed_fails: 3
  cooldown_time_seconds: 60
# ── O5: permission.task — glob rules for which subagents an agent may
# invoke (last matching rule wins; deny removes the agent from the delegate
# tool description entirely — prevents circular delegation at the
# permission layer). Default "*": allow keeps the existing runtime matrix
# (zeus → anyone; athena/hermes → apollo only). Example deny-first config:
#   permission:
#     task:
#       "*": deny
#       "orchestrator-*": allow
permission:
  task:
    "*": allow
todo_enforcer:
  enabled: true
  cooldown_base_ms: 5000            # base backoff between injections
  max_consecutive_failures: 5       # stop injecting after this many failures
  failure_reset_ms: 300000          # quiet period before the counter resets (5 min)
  user_activity_quiet_ms: 30000     # skip injection this long after a user message (30s)
  child_active_ms: 120000           # native (non-board) background child newer than this = still running → skip (2 min).
                                    # Board children (delegations) are resolved by taskID instead: running → skip;
                                    # terminal jobs (completed/error/cancelled/reconciled) NEVER suppress (T6 fix).
  # Runtime kill-switch: PANTHEON_TODO_ENFORCER=off (doc mirror only — the
  # env var is the real switch, read at plugin construction).
hashline:
  enabled: true
  enhance_read: true
  # Wave 2 (PR #46): tag-anchored edits. enhance_read augments `read` output
  # with per-line sha256 tags (12#XJ|content); hashline_edit anchors edits to
  # those refs. Documentation mirror — the plugin resolves behavior in code.
full_auto:
  enabled: false                 # opt-in: goal continuations are OFF by default
  max_continuations: 25          # hard cap on goal continuations per session
  # Wave 3 (PR #46): full-auto goal loop. One active goal per session
  # (pending → in_progress → done); while active, idle sessions are
  # continued automatically toward the objective. Documentation mirror —
  # the plugin resolves behavior in code (GOAL_LOOP_DEFAULTS).
