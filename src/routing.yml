    - security_audit
    - test_coverage_validation
    - quality_gate
    - dead_code_detection
    - deprecation_audit
    - memory_search
    - pantheon_resources
    - pantheon_code_mode
    subagent_can_delegate_to:
    - mnemosyne
    skills:
