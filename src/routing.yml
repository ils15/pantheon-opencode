version: 1.0
presets:
  go-deepseek:
    description: "DeepSeek tiering via OpenCode Zen: V4 Pro for planners/reviewers (free on Zen), V4 Flash for implementers, V4 Flash Free for scouts. Vision turns route to MiniMax M3 (opencode-go; Qwen3.7 Plus image input fails on the Go gateway — opencode#29956). Prices verified 2026-08."
    vision:
      model: opencode-go/minimax-m3
      reasoning_effort: medium
    providers:
      opencode:
        baseURL: https://opencode.ai/zen/v1
        apiKeyEnv: PANTHEON_OPENCODE_API_KEY
      opencode-go:
        baseURL: https://opencode.ai/zen/go/v1
        apiKeyEnv: PANTHEON_OPENCODE_API_KEY
    agents:
      athena:     { model: opencode/deepseek-v4-pro,       reasoning_effort: high,   fallback_models: [opencode/mimo-v2.5] }
      themis:     { model: opencode/deepseek-v4-pro,       reasoning_effort: high,   fallback_models: [opencode/mimo-v2.5] }
      zeus:       { model: opencode/deepseek-v4-flash,     reasoning_effort: medium, fallback_models: [opencode/mimo-v2.5] }
      hermes:     { model: opencode/deepseek-v4-flash,     reasoning_effort: medium, fallback_models: [opencode/mimo-v2.5] }
      aphrodite:  { model: opencode/deepseek-v4-flash,     reasoning_effort: medium, fallback_models: [opencode/mimo-v2.5] }
      demeter:    { model: opencode/deepseek-v4-flash,     reasoning_effort: medium, fallback_models: [opencode/mimo-v2.5] }
      prometheus: { model: opencode/deepseek-v4-flash,     reasoning_effort: medium, fallback_models: [opencode/mimo-v2.5] }
      hephaestus: { model: opencode/deepseek-v4-flash,     reasoning_effort: medium, fallback_models: [opencode/mimo-v2.5] }
      apollo:     { model: opencode/deepseek-v4-flash-free, reasoning_effort: low,   fallback_models: [opencode/mimo-v2.5] }
      nyx:        { model: opencode/deepseek-v4-flash-free, reasoning_effort: low,   fallback_models: [opencode/mimo-v2.5] }
      gaia:       { model: opencode/deepseek-v4-flash-free, reasoning_effort: low,   fallback_models: [opencode/mimo-v2.5] }
      iris:       { model: opencode/deepseek-v4-flash-free, reasoning_effort: low,   fallback_models: [opencode/mimo-v2.5] }
      mnemosyne:  { model: opencode/deepseek-v4-flash-free, reasoning_effort: low,   fallback_models: [opencode/mimo-v2.5] }
      talos:      { model: opencode/deepseek-v4-flash-free, reasoning_effort: low,   fallback_models: [opencode/mimo-v2.5] }
  go-fast:
    description: "All 14 agents on DeepSeek V4 Flash via OpenCode Go with reasoning_effort low everywhere. Fastest tier. Vision turns route to MiniMax M2.5 (mimo-v2.5). Prices verified 2026-08."
    vision:
      model: opencode-go/mimo-v2.5
      reasoning_effort: low
    providers:
      opencode-go:
        baseURL: https://opencode.ai/zen/go/v1
        apiKeyEnv: PANTHEON_OPENCODE_API_KEY
    agents:
      athena:     { model: opencode-go/deepseek-v4-flash, reasoning_effort: low }
      themis:     { model: opencode-go/deepseek-v4-flash, reasoning_effort: low }
      zeus:       { model: opencode-go/deepseek-v4-flash, reasoning_effort: low }
      hermes:     { model: opencode-go/deepseek-v4-flash, reasoning_effort: low }
      aphrodite:  { model: opencode-go/deepseek-v4-flash, reasoning_effort: low }
      demeter:    { model: opencode-go/deepseek-v4-flash, reasoning_effort: low }
      prometheus: { model: opencode-go/deepseek-v4-flash, reasoning_effort: low }
      hephaestus: { model: opencode-go/deepseek-v4-flash, reasoning_effort: low }
      apollo:     { model: opencode-go/deepseek-v4-flash, reasoning_effort: low }
      nyx:        { model: opencode-go/deepseek-v4-flash, reasoning_effort: low }
      gaia:       { model: opencode-go/deepseek-v4-flash, reasoning_effort: low }
      iris:       { model: opencode-go/deepseek-v4-flash, reasoning_effort: low }
      mnemosyne:  { model: opencode-go/deepseek-v4-flash, reasoning_effort: low }
      talos:      { model: opencode-go/deepseek-v4-flash, reasoning_effort: low }
  go-claude:
    description: "Anthropic Claude tiering: Opus 4.8 for planners/reviewers, Sonnet 5 for implementers, Haiku 4.5 for scouts. Vision turns route to Sonnet 5 (native image support). Prices verified 2026-07."
    vision:
      model: anthropic/claude-sonnet-5
      reasoning_effort: medium
    providers:
      anthropic:
        baseURL: https://api.anthropic.com
        apiKeyEnv: PANTHEON_ANTHROPIC_API_KEY
    agents:
      athena:     { model: anthropic/claude-opus-4-8, reasoning_effort: high }
      themis:     { model: anthropic/claude-opus-4-8, reasoning_effort: high }
      zeus:       { model: anthropic/claude-sonnet-5, reasoning_effort: medium }
      hermes:     { model: anthropic/claude-sonnet-5, reasoning_effort: medium }
      aphrodite:  { model: anthropic/claude-sonnet-5, reasoning_effort: medium }
      demeter:    { model: anthropic/claude-sonnet-5, reasoning_effort: medium }
      prometheus: { model: anthropic/claude-sonnet-5, reasoning_effort: medium }
      hephaestus: { model: anthropic/claude-sonnet-5, reasoning_effort: medium }
      apollo:     { model: anthropic/claude-haiku-4-5, reasoning_effort: low }
      nyx:        { model: anthropic/claude-haiku-4-5, reasoning_effort: low }
      gaia:       { model: anthropic/claude-haiku-4-5, reasoning_effort: low }
      iris:       { model: anthropic/claude-haiku-4-5, reasoning_effort: low }
      mnemosyne:  { model: anthropic/claude-haiku-4-5, reasoning_effort: low }
      talos:      { model: anthropic/claude-haiku-4-5, reasoning_effort: low }
  go-openai:
    description: "OpenAI GPT-5.6 family tiering: Sol for planners/reviewers, Terra for implementers, Luna Fast for scouts. Vision turns route to GPT-5.6 Sol. Prices verified 2026-07."
    vision:
      model: openai/gpt-5.6-sol
      reasoning_effort: high
    providers:
      openai:
        baseURL: https://api.openai.com/v1
        apiKeyEnv: PANTHEON_OPENAI_API_KEY
    agents:
      athena:     { model: openai/gpt-5.6-sol, reasoning_effort: high }
      themis:     { model: openai/gpt-5.6-sol, reasoning_effort: high }
      zeus:       { model: openai/gpt-5.6-terra, reasoning_effort: medium }
      hermes:     { model: openai/gpt-5.6-terra, reasoning_effort: medium }
      aphrodite:  { model: openai/gpt-5.6-terra, reasoning_effort: medium }
      demeter:    { model: openai/gpt-5.6-terra, reasoning_effort: medium }
      prometheus: { model: openai/gpt-5.6-terra, reasoning_effort: medium }
      hephaestus: { model: openai/gpt-5.6-terra, reasoning_effort: medium }
      apollo:     { model: openai/gpt-5.6-luna-fast, reasoning_effort: low }
      nyx:        { model: openai/gpt-5.6-luna-fast, reasoning_effort: low }
      gaia:       { model: openai/gpt-5.6-luna-fast, reasoning_effort: low }
      iris:       { model: openai/gpt-5.6-luna-fast, reasoning_effort: low }
      mnemosyne:  { model: openai/gpt-5.6-luna-fast, reasoning_effort: low }
      talos:      { model: openai/gpt-5.6-luna-fast, reasoning_effort: low }
  go-premium:
    description: "Pantheon premium lineup on OpenCode Go (subscription): GLM-5.1 orchestrator, DeepSeek V4 Pro planner, Qwen3.7 Max reviewer, Kimi K2.6 designer, MiniMax M2.7 implementers, DeepSeek V4 Flash scouts. Vision turns route to MiniMax M3 (multimodal; Qwen3.7 Plus image input fails on the Go gateway — opencode#29956). Ported from Oh-My-OpenAgent 'opencode-go' preset. Requires OpenCode Go subscription. Prices verified 2026-08."
    vision:
      model: opencode-go/minimax-m3
      reasoning_effort: medium
    providers:
      opencode-go:
        baseURL: https://opencode.ai/zen/go/v1
        apiKeyEnv: PANTHEON_OPENCODE_API_KEY
    agents:
      zeus:       { model: opencode-go/glm-5.1,           reasoning_effort: medium }
      athena:     { model: opencode-go/deepseek-v4-pro,   reasoning_effort: high }
      themis:     { model: opencode-go/qwen3.7-max,       reasoning_effort: high }
      hermes:     { model: opencode-go/minimax-m2.7,      reasoning_effort: medium }
      aphrodite:  { model: opencode-go/kimi-k2.6,         reasoning_effort: medium }
      demeter:    { model: opencode-go/qwen3.7-plus,      reasoning_effort: medium }
      prometheus: { model: opencode-go/glm-5.2,           reasoning_effort: medium }
      hephaestus: { model: opencode-go/minimax-m2.7,      reasoning_effort: medium }
      apollo:     { model: opencode-go/deepseek-v4-flash, reasoning_effort: low }
      nyx:        { model: opencode-go/deepseek-v4-flash, reasoning_effort: low }
      gaia:       { model: opencode-go/deepseek-v4-flash, reasoning_effort: low }
      iris:       { model: opencode-go/deepseek-v4-flash, reasoning_effort: low }
      mnemosyne:  { model: opencode-go/deepseek-v4-flash, reasoning_effort: low }
      talos:      { model: opencode-go/deepseek-v4-flash, reasoning_effort: low }
  go-free:
    description: "Pantheon free lineup on OpenCode Zen free tier, $0: Big Pickle orchestrator, Nemotron 3 Ultra Free planner, North Mini Code scouts. Vision turns route to MiniMax M2.5 Free (mimo-v2.5-free, multimodal on Zen free). Ported from Oh-My-OpenAgent 'zen-free' preset. CAUTION: nemotron-3-ultra-free has known intermittent failures (opencode#38028) — switch to go-fast if flaky. Prices verified 2026-08."
    vision:
      model: opencode/mimo-v2.5-free
      reasoning_effort: low
    providers:
      opencode:
        baseURL: https://opencode.ai/zen/v1
        apiKeyEnv: PANTHEON_OPENCODE_API_KEY
    agents:
      zeus:       { model: opencode/big-pickle,             reasoning_effort: medium }
      athena:     { model: opencode/nemotron-3-ultra-free,  reasoning_effort: high }
      themis:     { model: opencode/deepseek-v4-flash-free, reasoning_effort: high }
      hermes:     { model: opencode/deepseek-v4-flash-free, reasoning_effort: medium }
      aphrodite:  { model: opencode/deepseek-v4-flash-free, reasoning_effort: medium }
      demeter:    { model: opencode/deepseek-v4-flash-free, reasoning_effort: medium }
      prometheus: { model: opencode/deepseek-v4-flash-free, reasoning_effort: medium }
      hephaestus: { model: opencode/deepseek-v4-flash-free, reasoning_effort: medium }
      apollo:     { model: opencode/north-mini-code-free,   reasoning_effort: low }
      nyx:        { model: opencode/north-mini-code-free,   reasoning_effort: low }
      gaia:       { model: opencode/north-mini-code-free,   reasoning_effort: low }
      iris:       { model: opencode/north-mini-code-free,   reasoning_effort: low }
      mnemosyne:  { model: opencode/north-mini-code-free,   reasoning_effort: low }
      talos:      { model: opencode/north-mini-code-free,   reasoning_effort: low }
agents:
  zeus:
    role: Central orchestrator
    reasoning_effort: medium
    user_invocable: true
    can_delegate: true
    can_receive_delegation: true
    capabilities:
    - orchestration
    - delegation
    - context_conservation
    - context_compression
    - phase_management
    - quality_gate_enforcement
    - memory_recall
    - pantheon_resources
    - pantheon_code_mode
    - pantheon_deepwork
    subagent_can_delegate_to:
    - athena
    - apollo
    - hermes
    - aphrodite
    - demeter
    - themis
    - prometheus
    - hephaestus
    - nyx
    - iris
    - mnemosyne
    - talos
    skills:
    - agent-coordination
    - session-goal
    - artifact-management
    - context-compression
    - auto-continue
    - orchestration-workflow
    - incremental-implementation
  athena:
    role: Strategic planner
    reasoning_effort: high
    user_invocable: true
    can_delegate: true
    can_receive_delegation: true
    capabilities:
    - strategic_planning
    - tdd_planning
    - architectural_design
    - root_cause_analysis
    - risk_assessment
    - memory_recall
    - pantheon_resources
    subagent_can_delegate_to:
    - apollo
    skills:
    - spec-driven-development
    - memory-bank
  apollo:
    role: Investigation scout
    reasoning_effort: low
    user_invocable: false
    can_delegate: false
    can_receive_delegation: true
    capabilities:
    - codebase_discovery
    - pattern_discovery
    - dependency_research
    - parallel_search
    - codemap_generation
    - memory_search
    - pantheon_resources
    subagent_can_delegate_to: []
    skills:
    - auto-continue
  hermes:
    role: Backend specialist
    reasoning_effort: medium
    user_invocable: true
    can_delegate: true
    can_receive_delegation: true
    capabilities:
    - backend_implementation
    - api_development
    - service_layer
    - async_programming
    - obsolete_lib_detection
    - memory_store
    - pantheon_code_mode
    subagent_can_delegate_to:
    - apollo
    - themis
    - mnemosyne
    skills:
    - tdd-with-agents
    - file-prompts
    - streaming-patterns
    - git-workflow-and-versioning
    - incremental-implementation
  aphrodite:
    role: Frontend specialist
    reasoning_effort: medium
    user_invocable: true
    can_delegate: false
    can_receive_delegation: true
    capabilities:
    - frontend_implementation
    - ui_component_design
    - accessibility_audit
    - responsive_design
    - deprecated_npm_detection
    - memory_store
    - pantheon_resources_memory_bank
    - pantheon_code_mode
    skills:
    - tdd-with-agents
    - visual-review-pipeline
    - file-prompts
  demeter:
    role: Database specialist
    reasoning_effort: medium
    user_invocable: true
    can_delegate: false
    can_receive_delegation: true
    capabilities:
    - database_migration
    - schema_design
    - query_optimization
    - n_plus_one_prevention
    - index_strategy
    - memory_store
    - memory_recall
    - pantheon_code_mode
