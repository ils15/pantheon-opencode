  iris:
    role: GitHub operations
    reasoning_effort: low
    user_invocable: true
    can_delegate: false
    can_receive_delegation: true
    capabilities:
    - branch_management
    - pull_request_creation
    - issue_tracking
    - release_management
    - changelog_generation
