auto_continue:
  checkpoint_script: .pantheon/code-mode/checkpoint-session.sh
  heartbeat_interval: 5
  idle:
    warning: 60
    stall: 120
    pause: 300
intent_gate:
  fix:
    patterns:
    - bug
    - error
    - crash
    - broken
    - fail
    - wrong
    - incorrect
    target: talos
  research:
    patterns:
    - how
    - what
    - why
    - where
    - find
    - search
    - lookup
    - documentation
    - procure
    - busque
    - encontre
    - localize
    - pesquise
    target: apollo
  investigate:
    patterns:
    - compare
    - vs
    - trade.?off
    - should
    - which
    - risk
    - impact
    target: athena
  plan:
    patterns:
    - plan
    - roadmap
    - architecture
    - design
    - proposal
    - strategy
    target: athena
  implement:
    patterns: []
    target: hermes
delegation:
  zeus:
  - target: athena
  - target: apollo
  - target: hermes
  - target: aphrodite
  - target: demeter
  - target: themis
  - target: prometheus
  - target: hephaestus
  - target: nyx
  - target: gaia
  - target: iris
  - target: mnemosyne
